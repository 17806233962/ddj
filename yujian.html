<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>御剑求生录 · 仙侠肉鸽</title>
<style>
  :root{--bg:#0a0d13;--panel:rgba(20,26,38,.92);--hi:#e6c86e;--ok:#7bc96f;--bad:#e05c5c;--blue:#7aa2c9;--line:#2a3550;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:#eee;
    font:14px/1.5 "Microsoft YaHei",sans-serif;touch-action:none;}
  canvas{display:block;position:absolute;inset:0;}
  /* ---- HUD 顶栏 ---- */
  #hud{position:absolute;top:10px;left:12px;right:12px;pointer-events:none;z-index:5;}
  #hpwrap{position:relative;height:18px;border-radius:9px;overflow:hidden;
    background:linear-gradient(#000c,#0009);border:1px solid #3a2030;box-shadow:0 2px 8px #0008;}
  #hpfill{height:100%;width:100%;border-radius:8px;
    background:linear-gradient(180deg,#f08a8a,#c03b3b 60%,#8f2424);transition:width .15s;}
  #hptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#ffd;text-shadow:0 1px 2px #000;letter-spacing:1px;}
  #xpwrap{margin-top:4px;height:8px;border-radius:4px;overflow:hidden;background:#000a;border:1px solid #243a2a;}
  #xpfill{height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,#3f8f5a,#8fe0a8);transition:width .15s;}
  #hudinfo{margin-top:6px;font-size:12px;color:#cdd6e4;text-shadow:0 1px 3px #000;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  #hudinfo b{color:var(--hi);font-weight:600;}
  .pill{display:inline-flex;align-items:center;gap:4px;background:rgba(10,14,22,.62);
    border:1px solid var(--line);border-radius:20px;padding:2px 10px;backdrop-filter:blur(3px);}
  /* ---- 技能栏 ---- */
  #skillsHud{position:absolute;top:78px;left:12px;z-index:5;pointer-events:none;
    display:flex;flex-direction:column;gap:5px;}
  #skillsHud .sk{display:flex;align-items:center;gap:6px;background:rgba(12,16,26,.72);
    border:1px solid var(--line);border-left:3px solid var(--hi);border-radius:8px;
    padding:3px 9px 3px 6px;font-size:12px;color:#dde;backdrop-filter:blur(3px);}
  #skillsHud .sk .ico{font-size:15px;filter:drop-shadow(0 0 4px #e6c86e66);}
  #skillsHud .sk .dir{color:#9aa8c0;font-size:11px;}
  /* ---- 摇杆 ---- */
  #stick{position:absolute;left:20px;bottom:26px;width:128px;height:128px;border-radius:50%;
    border:1.5px solid rgba(140,170,230,.35);background:radial-gradient(circle,rgba(30,40,60,.35),rgba(10,14,22,.15));
    box-shadow:inset 0 0 24px #0006, 0 4px 18px #0007;z-index:10;}
  #stick::after{content:"";position:absolute;inset:22%;border-radius:50%;border:1px dashed rgba(140,170,230,.22);}
  #stickKnob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#b9d4ff,#5f86c9 65%,#3c5a95);
    box-shadow:0 3px 12px #000a, inset 0 -4px 8px #0006, 0 0 14px #7aa2c955;}
  /* ---- 圆形按钮 ---- */
  .cbtn{width:58px;height:58px;border-radius:50%;font-size:13px;color:#dce6f5;
    border:1.5px solid rgba(140,170,230,.4);background:radial-gradient(circle at 35% 30%,rgba(60,80,120,.85),rgba(20,28,44,.9));
    box-shadow:0 4px 14px #0008, inset 0 1px 2px #fff2;}
  .cbtn:active{transform:scale(.94);filter:brightness(1.2);}
  /* ---- 弹窗 ---- */
  #overlay{position:absolute;inset:0;background:rgba(4,6,10,.72);backdrop-filter:blur(4px);
    z-index:20;display:none;align-items:center;justify-content:center;}
  #overlayBox{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:22px;max-width:540px;width:92%;max-height:88vh;overflow-y:auto;
    box-shadow:0 20px 60px #000c, inset 0 1px 0 #ffffff14;}
  .upcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:9px 0;
    cursor:pointer;background:linear-gradient(135deg,rgba(38,48,70,.5),rgba(20,26,40,.5));
    transition:border-color .12s, transform .12s, box-shadow .12s;}
  .upcard:hover{border-color:var(--hi);transform:translateY(-2px);
    box-shadow:0 6px 20px #0009, 0 0 18px #e6c86e22;}
  .upcard .t{font-size:16px;color:var(--hi);}
  .upcard .tagA{color:#e8b96a;border-color:#e8b96a66;}
  .upcard .tagB{color:#8fc1ee;border-color:#8fc1ee66;}
  .upsub{font-size:11px;border:1px solid;border-radius:10px;padding:0 8px;margin-left:8px;vertical-align:2px;}
  h2.ot{font-size:22px;letter-spacing:6px;text-align:center;
    background:linear-gradient(90deg,#c9a24a,#f5e3a0,#c9a24a);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .bigbtn{padding:12px 26px;border:none;border-radius:10px;font-size:16px;letter-spacing:4px;color:#fff;
    background:linear-gradient(180deg,#c94b3f,#9e2f26);box-shadow:0 4px 16px #000a, inset 0 1px 0 #fff3;}
  .bigbtn:active{transform:scale(.97);}
  .bigbtn.alt{background:linear-gradient(180deg,#3a5578,#263a55);}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="hpwrap"><div id="hpfill"></div><div id="hptext">100 / 100</div></div>
  <div id="xpwrap"><div id="xpfill"></div></div>
  <div id="hudinfo">
    <span class="pill">☯ <b id="lvl">炼气一层</b></span>
    <span class="pill">💎 <b id="gems">0</b></span>
    <span class="pill">☠ <b id="kills">0</b></span>
    <span class="pill">⏱ <b id="time">0:00</b></span>
    <span class="pill">🌊 <b id="wave">1</b></span>
  </div>
</div>
<div id="skillsHud"></div>
<div id="stick"><div id="stickKnob"></div></div>
<div style="position:absolute;right:16px;bottom:32px;z-index:10;">
  <button id="btnPause" class="cbtn">暂停</button>
</div>
<div id="overlay"><div id="overlayBox"></div></div>
<script>
/* ================= 工具 ================= */
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W=0,H=0;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
addEventListener("resize",resize);resize();
const rnd=(a,b)=>Math.random()*(b-a)+a;
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= 技能定义 =================
   每个技能两个进化方向 branchA/branchB，升级时选方向 */
const SKILLS={
  sword:{name:"御剑术",icon:"🗡",desc:"飞剑自动射向最近的妖兽",
    a:{name:"剑罡·穿透",desc:"飞剑可贯穿 2 只妖兽，伤害 +30%"},
    b:{name:"万剑归宗",desc:"每次多射出 1 把飞剑"}},
  thunder:{name:"掌心雷",icon:"⚡",desc:"雷电随机劈向一只妖兽",
    a:{name:"天雷引",desc:"雷电可连锁跳跃 2 次"},
    b:{name:"雷遁·疾",desc:"冷却 -30%，附带短暂麻痹"}},
  fire:{name:"丹火符",icon:"🔥",desc:"掷出火符，命中后爆炸",
    a:{name:"三昧真火",desc:"爆炸范围 +60%，留下灼烧地带"},
    b:{name:"火雨符",desc:"一次掷出 3 张火符"}},
  qi:{name:"罡气护体",icon:"🛡",desc:"罡气环绕周身，触碰妖兽造成伤害",
    a:{name:"金刚罡",desc:"罡气球 +1 个，伤害提升"},
    b:{name:"疾风环",desc:"旋转速度 +60%，范围扩大"}},
  ice:{name:"寒冰箭",icon:"❄",desc:"冰箭减速命中的妖兽",
    a:{name:"冰封千里",desc:"命中后小范围冻结 1 秒"},
    b:{name:"碎冰击",desc:"对被减速的妖兽伤害 +80%"}},
  dash:{name:"瞬身术",icon:"💨",desc:"受威胁时自动瞬移脱离（无敌帧）",
    a:{name:"缩地成寸",desc:"冷却 -40%，瞬移距离更远"},
    b:{name:"残影炸裂",desc:"瞬移起点爆出罡气，伤害周围妖兽"}},
};
const REALMS=["炼气一层","炼气三层","炼气六层","筑基","结丹","元婴","化神","炼虚","合体","大乘","渡劫","仙人"];

/* ================= 精灵贴图（手绘 16x16 圆润像素风，base64 内嵌） ================= */
const SPR_SRC={"player": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAwklEQVR42mNgoCUQEdP4LyKm8R+fGhZ8mqWklGDc/29e3WDEpo6JCM0MUlJKDLhcgtUFUlJKDIdmhKGI2WWsYnjz6gZxLjg0I4xBL2oWAwMDA5z+8OkDVq8y4gqDDycWoDhZwCKBkWgviIhp/P/07QCGGLaAZMSm+cq1M1hdpaNlwoBuCBO+OP51KYfh16UcBpLTwYFL76CsJggF5xNIB/icz8DAwHDl2hmM9MCCy3YrhjoU8WMMTUguIyLt42IPPgAAN9dKzUT7PcUAAAAASUVORK5CYII=", "wolf": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAhUlEQVR42mNgGDlAREzjv4iYxn/SJaHys1Yc+D9rxQEMdUwwRtukGQzYDBER0/jfNmkGTpcxMTAwMLx5dYOxKi8Dbggyhmn2+9GA1QAWdAFctm3iaMDtAkLOxAcwXHDhwgUUvoGBAZxdlZfB8ObVDUZkeUZiAwuXAVijEj1a8UUzE8MoAABj5D41nC/N+AAAAABJRU5ErkJggg==", "boar": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAo0lEQVR42mNgGPKAEZugiJjGf2zib17dwFDPgk3jlCQFrLblzGP4j24QE7LmKUkKDFw8Qjidy8UjxDAlSQHFhUzoirrC+HAagE2OCdn2TYduwSXwsZFdwYhsACkgZ94DhjevbjDCvXDpziuiXXDpzivMaBQR0/ifZsfFoKcihtPWS3deMcw69A0lFhixRWOaHRdWA2Yd+oYzPaAYAjMIF3uYAQAHy05+ZLWx4QAAAABJRU5ErkJggg==", "ghost": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAkklEQVR42mNgGPKAEZugiJjGf2zib17dYMRrAEzj7ktnsNrmqmeC0yAGETGN/+dffPl//sWX/3JKVnA2NjFkFzLCNOOyFRdw1TNhePPqBiMTPkX+Vm4M/lZueA1iwSe58dgugi6Bu+DknTdEOx9ZLRMuCWI0YxiQYaPAePLOGwYYNpTgweAzMDAw1AR5YI/KEQoAs4dXo3Bzp20AAAAASUVORK5CYII=", "elite": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAvUlEQVR42mNgoCYQEdP4LyKm8Z8UeSZkyTIXJoYyFyYGbIbgkmdBV9i15x9cAzZXdO35x/Dm1Q1GrAY8cFBgCHPA7cUHDAwMDHvuMWB4QURM439YixIDAwMDQx3bN6yaYeJhLUoormNCV9j0iwurAbjEWbAJKhx4wIDuNVwAqwH4NKADJgYGBoY3r24wrqq5R5SGVTX3UGIBJRAfXHuBV/ODay8wAhFrKuuK0vrfFaWFwSaUUrEmV6I0DW0AAFszTz0o1stRAAAAAElFTkSuQmCC", "boss": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAA0klEQVR42tVSvQnCQBT+cmSAK47jBkhxZcgEFikygQOIhBAcIGOkDCLW4gQWKZwgXGnhAIdYZIOzC+HlIkRtfNXj8b4/+IBfjJDaCandJ/9MSO3ahC8WbRMOIbVj9DBWKavalVXt6H0sGFLWtNNuvSmQmxOinQUA5IZjH9fufGxA3QY+VgCIDqthv2+vkwhp1+P5uAXhXEYfiIIHB9SFsT2yRg2AS2ERKz4BAwCj7BQMAFmjYGzvdcO+7VBAC9Im3KsWKz6x/7Zhc/uimi6t+J/OCw0rYF1uYstFAAAAAElFTkSuQmCC"};
const SPR={};for(const k in SPR_SRC){const _i=new Image();_i.src=SPR_SRC[k];SPR[k]=_i;}
function drawSpr(name,x,y,size,alpha){
  const img=SPR[name];
  ctx.save();if(alpha!==undefined)ctx.globalAlpha=alpha;
  ctx.imageSmoothingEnabled=false;
  if(img&&img.complete&&img.naturalWidth)ctx.drawImage(img,x-size/2,y-size/2,size,size);
  else{ctx.fillStyle="#99a";ctx.fillRect(x-size/2,y-size/2,size,size);}
  ctx.restore();
}
/* ================= 敌人 ================= */
const ETYPES=[
  {id:"wolf",name:"妖狼",hp:12,spd:50,dmg:4,r:12,gem:1,xp:1,color:"#b55"},
  {id:"boar",name:"石甲兽",hp:38,spd:26,dmg:8,r:16,gem:2,xp:3,color:"#886"},
  {id:"ghost",name:"鬼火",hp:8,spd:64,dmg:4,r:11,gem:1,xp:2,color:"#8ac"},
  {id:"elite",name:"妖将",hp:110,spd:32,dmg:12,r:20,gem:12,xp:15,color:"#d9a"},
  {id:"boss",name:"妖王",hp:480,spd:24,dmg:16,r:32,gem:60,xp:80,color:"#f4a"},
];

/* ================= 游戏状态 ================= */
const SAVE_KEY="yujian_save_v1";
let G=null; // 一局
let META=null; // 元进度（localStorage）
try{META=JSON.parse(localStorage.getItem(SAVE_KEY))||null;}catch(e){META=null;}
if(!META) META={gems:0,ups:{atk:0,hp:0,spd:0,xp:0,regen:0}};

const META_UPS={
  atk:{name:"攻伐之道",desc:"全伤害 +8%/级",max:10,cost:l=>20+l*15},
  hp:{name:"淬体之术",desc:"生命上限 +12%/级",max:10,cost:l=>20+l*15},
  spd:{name:"身法轻灵",desc:"移速 +4%/级",max:8,cost:l=>18+l*12},
  xp:{name:"悟性天成",desc:"灵气获取 +8%/级",max:8,cost:l=>22+l*14},
  regen:{name:"生生不息",desc:"每秒回复 +0.5/级",max:6,cost:l=>25+l*18},
};

function metaMul(k,base){ // 元进度乘区
  const m={atk:1+META.ups.atk*0.08,hp:1+META.ups.hp*0.12,spd:1+META.ups.spd*0.04,
           xp:1+META.ups.xp*0.08}[k]||1;
  return base*m;
}

function newGame(){
  G={t:0,wave:1,kills:0,over:false,paused:false,
    p:{x:W/2,y:H/2,r:12,hp:metaMul("hp",150),maxhp:metaMul("hp",150),
       spd:metaMul("spd",150),lv:1,xp:0,xpn:5,
       hurtCd:0,dashCd:0,iframe:0,
       skills:{}}, // id -> {lv, a:0, b:0}
    enemies:[],shots:[],orbs:[],fx:[],
    spawnT:0,eliteT:0,
  };
  grantSkill("sword");
  showLevelTip();
}
function realmName(lv){return REALMS[Math.min(REALMS.length-1,Math.floor(lv/3))];}

/* ================= 技能逻辑 ================= */
function grantSkill(id){G.p.skills[id]={lv:1,a:0,b:0};renderSkillHud();}
function skLv(id){return G.p.skills[id]?G.p.skills[id].lv:0;}

function castSkills(dt){
  const p=G.p;
  // 御剑术：飞向最近敌人
  if(p.skills.sword){
    const cd=Math.max(0.55,1.0-skLv("sword")*0.07);
    p.skills.sword.t=(p.skills.sword.t||0)-dt;
    if(p.skills.sword.t<=0){
      const n=1+(p.skills.sword.b||0);
      const pierce=2+(p.skills.sword.a||0)*2;
      const dmg=metaMul("atk",16+p.skills.sword.lv*5)*(1+(p.skills.sword.a||0)*0.3);
      const targets=nearestN(n);
      for(const e of targets){
        const ang=Math.atan2(e.y-p.y,e.x-p.x);
        G.shots.push({kind:"sword",x:p.x,y:p.y,vx:Math.cos(ang)*420,vy:Math.sin(ang)*420,
          dmg,pierce,hitset:new Set(),r:6,life:1.2});
      }
      p.skills.sword.t=cd;
    }
  }
  // 掌心雷：随机敌人落雷
  if(p.skills.thunder){
    const s=p.skills.thunder;
    s.t=(s.t||0)-dt;
    if(s.t<=0&&G.enemies.length){
      const cd=(2.2-s.lv*0.1)*(1-(s.b||0)*0.3);
      const e=G.enemies[ri(0,G.enemies.length-1)];
      zap(e,p,metaMul("atk",12+s.lv*4),s.a||0);
      let cur=e,chain=s.a||0,used=new Set([e]);
      while(chain>0){
        const nx=G.enemies.filter(x=>!used.has(x)&&dist(x,cur)<160)[0];
        if(!nx)break;
        zap(nx,p,metaMul("atk",10+s.lv*3),0);used.add(nx);cur=nx;chain--;
      }
      if(s.b)G.enemies.forEach(x=>{if(dist(x,e)<90)x.stun=Math.max(x.stun||0,0.6);});
      s.t=cd;
    }
  }
  // 丹火符
  if(p.skills.fire){
    const s=p.skills.fire;
    s.t=(s.t||0)-dt;
    if(s.t<=0&&G.enemies.length){
      const cd=2.5-s.lv*0.12;
      const n=1+(s.b||0)*2;
      for(let i=0;i<n;i++){
        const e=nearestN(1)[0]||G.enemies[0];
        const ang=Math.atan2(e.y-p.y,e.x-p.x)+rnd(-0.3,0.3);
        G.shots.push({kind:"fire",x:p.x,y:p.y,vx:Math.cos(ang)*300,vy:Math.sin(ang)*300,
          dmg:metaMul("atk",10+s.lv*4),r:8,life:1.5,burn:s.a||0,radius:46*(1+(s.a||0)*0.6)});
      }
      s.t=cd;
    }
  }
  // 寒冰箭
  if(p.skills.ice){
    const s=p.skills.ice;
    s.t=(s.t||0)-dt;
    if(s.t<=0&&G.enemies.length){
      const cd=2.0-s.lv*0.1;
      const e=nearestN(1)[0];
      const ang=Math.atan2(e.y-p.y,e.x-p.x);
      G.shots.push({kind:"ice",x:p.x,y:p.y,vx:Math.cos(ang)*380,vy:Math.sin(ang)*380,
        dmg:metaMul("atk",7+s.lv*2.5)*(1+(s.b||0)*0.8),r:6,life:1.4,freeze:s.a||0,slow:true});
      s.t=cd;
    }
  }
  // 瞬身术：最近敌人 < 50 且冷却好 → 脱离
  if(p.skills.dash){
    const s=p.skills.dash;
    p.dashCd-=dt;
    const near=G.enemies.filter(e=>dist(e,p)<60);
    if(near.length>=2&&p.dashCd<=0){
      const cd=(5-s.lv*0.25)*(1-(s.a||0)*0.4);
      // 反方向瞬移
      let ax=0,ay=0;near.forEach(e=>{ax+=p.x-e.x;ay+=p.y-e.y;});
      const m=Math.hypot(ax,ay)||1;
      const d=140+(s.a||0)*60;
      p.x=clamp(p.x+ax/m*d,20,W-20);p.y=clamp(p.y+ay/m*d,20,H-20);
      p.iframe=0.8;p.dashCd=cd;
      fx(p.x,p.y,"#8fd");
      if(s.b){ // 残影炸裂：起点伤害
        G.enemies.forEach(e=>{if(dist(e,p)<120)hurtEnemy(e,metaMul("atk",15+s.lv*5));});
        fx(p.x,p.y,"#fca",120);
      }
    }
  }
}
function zap(e,p,dmg,chain){
  fx(e.x,e.y-30,"#8ef",10);hurtEnemy(e,dmg);
  G.fx.push({x:e.x,y:e.y,kind:"burst",c:"#bfe8ff",size:26,life:0.22,t:0.22});
  G.fx.push({x:e.x,y:e.y-120,x2:e.x,y2:e.y,kind:"bolt",life:0.18,t:0.18});
}
function nearestN(n){
  return [...G.enemies].filter(e=>dist(e,G.p)<600)
    .sort((a,b)=>dist(a,G.p)-dist(b,G.p)).slice(0,n);
}
/* 罡气护体：每帧环绕 */
function qiTick(dt){
  const p=G.p,s=p.skills.qi;if(!s)return;
  s.ang=(s.ang||0)+dt*(2.2+(s.b||0)*1.32);
  const n=1+s.lv-1+(s.a||0); // 1球起步，升级+1，金刚罡再+1
  s.orbs=[];const R=46*(1+(s.b||0)*0.35);
  for(let i=0;i<n;i++){
    const a=s.ang+i*Math.PI*2/n;
    const ox=p.x+Math.cos(a)*R,oy=p.y+Math.sin(a)*R;
    s.orbs.push({x:ox,y:oy});
    G.enemies.forEach(e=>{
      if(dist(e,{x:ox,y:oy})<e.r+9){
        if(!e.qiCd||e.qiCd<=0){hurtEnemy(e,metaMul("atk",6+s.lv*2)*(1+(s.a||0)*0.3));e.qiCd=0.4;}
      }
    });
  }
}
function fx(x,y,c,r){G.fx.push({x,y,c,r:r||26,kind:"ring",life:0.3,t:0.3});}
function banner(txt){G.fx.push({x:W/2,y:H*0.3,kind:"banner",life:1.6,t:1.6,txt});}

/* ================= 敌人 ================= */
function spawnWave(dt){
  G.spawnT-=dt;
  if(G.spawnT<=0){
    G.spawnT=Math.max(1.0,2.6-G.wave*0.07); // 刷怪间隔放缓
    const level=G.wave;
    const pool=ETYPES.filter(t=>t.id!=="elite"&&t.id!=="boss");
    const t=pool[ri(0,pool.length-1)];
    const hpMul=1+level*0.12; // 成长放缓
    for(let i=0;i<ri(1,1+Math.min(2,level/4|0));i++){ // 每批 1-2 只起步
      const a=rnd(0,Math.PI*2),d=rnd(Math.max(W,H)*0.55,Math.max(W,H)*0.75);
      G.enemies.push(mkEnemy(t,W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,hpMul));
    }
  }
  G.eliteT-=dt;
  if(G.eliteT<=0){
    G.eliteT=40; // 波次节奏放缓（26s → 40s）
    G.wave++;
    if(G.wave%5===0){ // boss 波（每 5 波，原每 4 波）
      const a=rnd(0,Math.PI*2),d=Math.max(W,H)*0.6;
      G.enemies.push(mkEnemy(ETYPES[4],W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,1+G.wave*0.08));
      banner("⚠ 妖王降世 ⚠");
    }else if(G.wave>1){
      const a=rnd(0,Math.PI*2),d=Math.max(W,H)*0.6;
      G.enemies.push(mkEnemy(ETYPES[3],W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,1+G.wave*0.08));
      banner(`第 ${G.wave} 波 · 妖将出击`);
    }
  }
}
function mkEnemy(t,x,y,hpMul){
  return {type:t,hp:t.hp*hpMul,maxhp:t.hp*hpMul,x,y,spd:t.spd*rnd(0.9,1.1),
    dmg:t.dmg,r:t.r,stun:0,slowT:0,qiCd:0,hitCd:0};
}
function hurtEnemy(e,dmg){
  e.hp-=dmg;
  if(dmg>=1)G.fx.push({x:e.x+rnd(-6,6),y:e.y-e.r-4,c:dmg>=30?"#ff9a54":"#ffe9b0",kind:"dmg",life:0.6,t:0.6,txt:Math.round(dmg)});
  if(e.hp<=0&&!e.dead){
    e.dead=true;G.kills++;
    const n=e.type.gem;G.gemRun=(G.gemRun||0)+n;
    for(let i=0;i<(e.type.xp>4?4:1);i++)
      G.orbs.push({x:e.x+rnd(-12,12),y:e.y+rnd(-12,12),v:e.type.xp/(e.type.xp>4?4:1)});
  }
}
function enemyTick(dt){
  const p=G.p;
  for(const e of G.enemies){
    if(e.stun>0){e.stun-=dt;continue;}
    let sp=e.spd;
    if(e.slowT>0){e.slowT-=dt;sp*=0.45;}
    const d=dist(e,p)||1;
    e.x+=(p.x-e.x)/d*sp*dt;e.y+=(p.y-e.y)/d*sp*dt;
    // 碰撞伤害
    e.hitCd-=dt;
    if(dist(e,p)<e.r+p.r&&e.hitCd<=0&&p.iframe<=0){
      e.hitCd=1.0;p.hp-=e.dmg;p.iframe=0.55;fx(p.x,p.y,"#e06c6c",30);
      if(p.hp<=0)gameOver();
    }
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
}

/* ================= 弹道 ================= */
function shotTick(dt){
  for(const s of G.shots){
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(s.kind==="fire"&&s.life<=0){explode(s);s.dead=true;continue;}
    for(const e of G.enemies){
      if(s.kind==="sword"&&s.hitset.has(e))continue;
      if(dist(s,e)<e.r+s.r){
        if(s.kind==="fire"){explode(s);s.dead=true;break;}
        hurtEnemy(e,s.dmg);
        if(s.slow){e.slowT=2;if(s.freeze){G.enemies.forEach(x=>{if(dist(x,e)<80)x.stun=Math.max(x.stun,1);});}}
        if(s.kind==="sword"){
          s.hitset.add(e);
          if(s.hitset.size>s.pierce){s.dead=true;break;}
        } else {s.dead=true;break;}
      }
    }
    if(s.x<-50||s.x>W+50||s.y<-50||s.y>H+50)s.dead=true;
  }
  G.shots=G.shots.filter(s=>!s.dead&&s.life>0);
}
function explode(s){
  fx(s.x,s.y,"#f94",s.radius);
  G.fx.push({x:s.x,y:s.y,kind:"burst",c:"#ffb066",size:s.radius*0.9,life:0.35,t:0.35});
  G.enemies.forEach(e=>{if(dist(e,s)<s.radius+e.r)hurtEnemy(e,s.dmg);});
  if(s.burn)G.fx.push({x:s.x,y:s.y,c:"#f74",r:s.radius,kind:"zone",life:2,t:2,dps:metaMul("atk",6)});
}

/* ================= 经验/升级 ================= */
function orbTick(dt){
  const p=G.p;
  for(const o of G.orbs){
    const d=dist(o,p);
    if(d<150){o.x+=(p.x-o.x)/d*300*dt;o.y+=(p.y-o.y)/d*300*dt;}
    if(d<16){o.dead=true;gainXp(o.v);}
  }
  G.orbs=G.orbs.filter(o=>!o.dead);
}
function gainXp(v){
  const p=G.p;p.xp+=v*metaMul("xp",1);
  while(p.xp>=p.xpn){
    p.xp-=p.xpn;p.lv++;p.xpn=Math.round(p.xpn*1.25+2);
    p.maxhp+=10;p.hp=Math.min(p.maxhp,p.hp+30);
    levelUpModal();
  }
}
function levelUpModal(){
  G.paused=true;
  const opts=rollUpgrades();
  const box=document.getElementById("overlayBox");
  box.innerHTML=`<h2 class="ot">突破 · ${realmName(G.p.lv)}</h2>
    <p style="text-align:center;color:#8896ad;font-size:12px;margin:4px 0 10px">道心抉择，三选其一</p><div id="ups"></div>`;
  const c=box.querySelector("#ups");
  opts.forEach(o=>{
    const d=document.createElement("div");
    d.className="upcard";
    d.innerHTML=`<span class="t">${o.title}</span><span class="upsub ${o.sub==="方向A"?"tagA":o.sub==="方向B"?"tagB":""}">${o.sub}</span><br>
      <span style="color:#aeb9cc;font-size:13px">${o.desc}</span>`;
    d.onclick=()=>{o.apply();G.paused=false;
      document.getElementById("overlay").style.display="none";
      renderSkillHud();saveMeta();};
    c.appendChild(d);
  });
  document.getElementById("overlay").style.display="flex";
}
function rollUpgrades(){
  const p=G.p,opts=[];
  const owned=Object.keys(p.skills);
  // 新技能
  const unowned=Object.keys(SKILLS).filter(id=>!p.skills[id]);
  if(unowned.length){
    const id=unowned[ri(0,unowned.length-1)];
    opts.push({title:SKILLS[id].icon+" 习得「"+SKILLS[id].name+"」",sub:"新技能",
      desc:SKILLS[id].desc,apply:()=>grantSkill(id)});
  }
  // 已有技能升级：提供两个方向分支
  const upgradable=owned.filter(id=>p.skills[id].lv<6);
  while(opts.length<3&&upgradable.length){
    const idx=ri(0,upgradable.length-1);
    const id=upgradable.splice(idx,1)[0];
    const s=p.skills[id],sk=SKILLS[id];
    if(s.lv===1){ // 第一次升级：两个方向任选
      opts.push({title:`${sk.icon}「${sk.name}」→ ${sk.a.name}`,sub:"方向A",desc:sk.a.desc,
        apply:()=>{s.lv++;s.a=1;}});
      opts.push({title:`${sk.icon}「${sk.name}」→ ${sk.b.name}`,sub:"方向B",desc:sk.b.desc,
        apply:()=>{s.lv++;s.b=1;}});
    }else{
      // 沿已选方向深化，或转另一方向
      const mainA=s.a>=s.b;
      opts.push({title:`${sk.icon}「${sk.name}」精进`,sub:`${mainA?sk.a.name:sk.b.name} Lv${s.lv}`,
        desc:`${mainA?sk.a.desc:sk.b.desc}（效果叠加）`,apply:()=>{s.lv++;if(mainA)s.a++;else s.b++;}});
    }
  }
  // 通用强化兜底
  while(opts.length<3){
    const g=[["❤ 淬炼肉身","生命上限 +25，并回满",()=>{p.maxhp+=25;p.hp=p.maxhp;}],
      ["🗡 磨砺锋芒","全伤害 +10%",()=>{META?0:0;p.atkBuff=(p.atkBuff||1)*1.1;}],
      ["👟 步罡踏斗","移速 +12%",()=>{p.spd*=1.12;}]][opts.length%3];
    opts.push({title:g[0],sub:"通用",desc:g[1],apply:g[2]});
  }
  return opts.slice(0,3);
}

/* ================= 输入 ================= */
const input={x:0,y:0};
addEventListener("keydown",e=>{
  if(e.key==="w"||e.key==="ArrowUp")input.ky=-1;
  if(e.key==="s"||e.key==="ArrowDown")input.ky=1;
  if(e.key==="a"||e.key==="ArrowLeft")input.kx=-1;
  if(e.key==="d"||e.key==="ArrowRight")input.kx=1;
});
addEventListener("keyup",e=>{
  if(e.key==="w"||e.key==="s"||e.key==="ArrowUp"||e.key==="ArrowDown")input.ky=0;
  if(e.key==="a"||e.key==="d"||e.key==="ArrowLeft"||e.key==="ArrowRight")input.kx=0;
});
const stick=document.getElementById("stick"),knob=document.getElementById("stickKnob");
let stickId=null;
function stickMove(t){
  const r=stick.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  let dx=t.clientX-cx,dy=t.clientY-cy;
  const m=Math.hypot(dx,dy),max=r.width/2-20;
  if(m>max){dx=dx/m*max;dy=dy/m*max;}
  knob.style.left=(35+dx)+"px";knob.style.top=(35+dy)+"px";
  input.x=dx/max;input.y=dy/max;
}
stick.addEventListener("touchstart",e=>{stickId=e.changedTouches[0].identifier;stickMove(e.changedTouches[0]);e.preventDefault();},{passive:false});
addEventListener("touchmove",e=>{for(const t of e.changedTouches)if(t.identifier===stickId)stickMove(t);},{passive:false});
addEventListener("touchend",e=>{for(const t of e.changedTouches)if(t.identifier===stickId){stickId=null;input.x=input.y=0;knob.style.left="35px";knob.style.top="35px";}});
stick.addEventListener("mousedown",e=>{stickId="m";stickMove(e);});
addEventListener("mousemove",e=>{if(stickId==="m")stickMove(e);});
addEventListener("mouseup",()=>{if(stickId==="m"){stickId=null;input.x=input.y=0;knob.style.left="35px";knob.style.top="35px";}});

/* ================= 主循环 ================= */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(G&&!G.paused&&!G.over){
    tick(dt);
  }
  draw();
}
function tick(dt){
  G.t+=dt;
  const p=G.p;
  // 移动
  let mx=input.x||(input.kx||0),my=input.y||(input.ky||0);
  const mm=Math.hypot(mx,my);
  if(mm>0.15){p.x=clamp(p.x+mx/mm*p.spd*dt,16,W-16);p.y=clamp(p.y+my/mm*p.spd*dt,16,H-16);}
  p.iframe=Math.max(0,p.iframe-dt);
  p.hp=Math.min(p.maxhp,p.hp+(1.0+META.ups.regen*0.5)*dt); // 基础回血 1/秒
  castSkills(dt);qiTick(dt);
  spawnWave(dt);enemyTick(dt);shotTick(dt);orbTick(dt);
  // 灼烧地带
  for(const f of G.fx)if(f.kind==="zone")
    G.enemies.forEach(e=>{if(dist(e,f)<f.r)e.hp-=f.dps*dt,e.hp<=0&&!e.dead&&hurtEnemy(e,0.01);});
  G.fx.forEach(f=>{f.life-=dt;});
  G.fx=G.fx.filter(f=>f.life>0);
  hud();
}

/* ================= 渲染 ================= */
function draw(){
  // 背景：深色渐变 + 远山淡纹 + 星点
  const bg=ctx.createRadialGradient(W/2,H*0.42,0,W/2,H*0.42,Math.max(W,H)*0.8);
  bg.addColorStop(0,"#131a2a");bg.addColorStop(1,"#070a10");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.5;ctx.fillStyle="#1a2334";
  for(let i=0;i<26;i++){ // 云纹
    const x=(i*211.7)%W,y=(i*137.3)%H;
    ctx.beginPath();ctx.ellipse(x,y,26,5,0,0,7);ctx.fill();
  }
  ctx.globalAlpha=0.8;ctx.fillStyle="#2c3a55";
  for(let i=0;i<48;i++){const x=(i*173.3)%W,y=(i*97.7)%H;ctx.fillRect(x,y,2,2);}
  ctx.globalAlpha=1;
  if(!G)return;
  const p=G.p;
  // 灵气球：辉光灵钻
  for(const o of G.orbs){
    ctx.fillStyle="#7bc96f44";ctx.beginPath();ctx.arc(o.x,o.y,9,0,7);ctx.fill();
    const by=o.y+Math.sin(G.t*5+o.x)*2;
    ctx.fillStyle="#a8e890";
    ctx.beginPath();ctx.moveTo(o.x,by-6);ctx.lineTo(o.x+4,by);ctx.lineTo(o.x,by+6);ctx.lineTo(o.x-4,by);ctx.closePath();ctx.fill();
    ctx.fillStyle="#e8ffd8";ctx.beginPath();ctx.arc(o.x,by-2,1.5,0,7);ctx.fill();
  }
  // 灼烧地带先画（在敌人下面）
  for(const f of G.fx)if(f.kind==="zone"){
    ctx.fillStyle=f.c;ctx.globalAlpha=0.16;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();
    ctx.globalAlpha=0.5;ctx.strokeStyle=f.c;ctx.stroke();ctx.globalAlpha=1;
  }
  // 敌人：按种类分形状
  for(const e of G.enemies)drawEnemy(e);
  // 弹幕：程序绘制，飞剑转向飞行方向
  for(const s of G.shots){
    const ang=Math.atan2(s.vy,s.vx);
    ctx.save();ctx.translate(s.x,s.y);
    if(s.kind==="sword"){
      ctx.rotate(ang);
      // 剑形：银刃金柄
      ctx.fillStyle="#dfe9ff";
      ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(2,-3.4);ctx.lineTo(-8,-2);ctx.lineTo(-8,2);ctx.lineTo(2,3.4);ctx.closePath();ctx.fill();
      ctx.strokeStyle="#9ab8ff";ctx.stroke();
      ctx.fillStyle="#e6c86e";ctx.fillRect(-11,-4,4,8);
    }else if(s.kind==="fire"){
      // 火符：旋转火球带尾焰
      ctx.rotate(G.t*8);
      const g=ctx.createRadialGradient(0,0,1,0,0,10);
      g.addColorStop(0,"#fff2b0");g.addColorStop(.5,"#ff9a3c");g.addColorStop(1,"#e04a10");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();
    }else if(s.kind==="ice"){
      // 冰晶：六角星
      ctx.rotate(G.t*3);
      ctx.strokeStyle="#cfeaff";ctx.lineWidth=2;
      for(let i=0;i<3;i++){ctx.rotate(Math.PI/3);
        ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(8,0);ctx.stroke();}
      ctx.fillStyle="#eaf7ff";ctx.beginPath();ctx.arc(0,0,3,0,7);ctx.fill();
      ctx.lineWidth=1;
    }
    ctx.restore();
    // 拖尾光晕
    ctx.fillStyle=s.kind==="sword"?"#dce8ff33":s.kind==="fire"?"#ff9a5433":"#9ad8ff33";
    ctx.beginPath();ctx.arc(s.x-s.vx*0.02,s.y-s.vy*0.02,s.r+3,0,7);ctx.fill();
  }
  // 罡气球
  if(p.skills.qi&&p.skills.qi.orbs){
    for(const o of p.skills.qi.orbs){
      ctx.fillStyle="rgba(138,187,255,.30)";
      ctx.beginPath();ctx.arc(o.x,o.y,12,0,7);ctx.fill();
      ctx.fillStyle="#cfe2ff";ctx.beginPath();ctx.arc(o.x,o.y,5,0,7);ctx.fill();
      ctx.strokeStyle="#eaf3ff";ctx.stroke();
    }
  }
  // 主角：修士贴图 + 灵光
  const pulse=1+Math.sin(G.t*4)*0.08;
  const aura=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,p.r*2.6*pulse);
  aura.addColorStop(0,"rgba(230,200,110,.45)");aura.addColorStop(1,"rgba(230,200,110,0)");
  ctx.fillStyle=aura;ctx.beginPath();ctx.arc(p.x,p.y,p.r*2.6*pulse,0,7);ctx.fill();
  drawSpr("player",p.x,p.y+Math.sin(G.t*6)*1.5,40,p.iframe>0&&(G.t*20|0)%2===0?0.45:1);
  // 特效
  for(const f of G.fx){
    const k=f.life/(f.t||0.3);
    if(f.kind==="ring"){
      ctx.strokeStyle=f.c;ctx.globalAlpha=k;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.4-k*0.4),0,7);ctx.stroke();
      ctx.globalAlpha=1;ctx.lineWidth=1;
    }else if(f.kind==="bolt"){
      ctx.strokeStyle="#bfe8ff";ctx.globalAlpha=k;ctx.lineWidth=3.5;
      ctx.shadowColor="#8ef";ctx.shadowBlur=8;
      ctx.beginPath();ctx.moveTo(f.x,f.y);
      let x=f.x,y=f.y;
      for(let i=0;i<4;i++){x+=rnd(-14,14);y+=(f.y2-f.y)/4;ctx.lineTo(x,y);}
      ctx.lineTo(f.x2,f.y2);ctx.stroke();
      ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.lineWidth=1;
    }else if(f.kind==="dmg"){ // 伤害飘字
      ctx.globalAlpha=Math.min(1,k*1.4);
      ctx.font="bold 13px sans-serif";ctx.fillStyle=f.c||"#ffd";ctx.textAlign="center";
      ctx.fillText(f.txt,f.x,f.y-(1-k)*26);
      ctx.globalAlpha=1;ctx.textAlign="left";
    }else if(f.kind==="burst"){ // 爆闪
      ctx.globalAlpha=k*0.9;
      const r=f.size*(1.6-k*0.6);
      const g=ctx.createRadialGradient(f.x,f.y,1,f.x,f.y,r);
      g.addColorStop(0,"#ffffff");g.addColorStop(0.4,f.c);g.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,r,0,7);ctx.fill();
      ctx.globalAlpha=1;
    }else if(f.kind==="banner"){
      ctx.globalAlpha=Math.min(1,k*2);
      ctx.font="bold 26px 'Microsoft YaHei'";ctx.textAlign="center";
      ctx.shadowColor="#000";ctx.shadowBlur=10;
      ctx.fillStyle="#e6c86e";ctx.fillText(f.txt,W/2,f.y);
      ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.textAlign="left";
    }
  }
}
function drawEmoji(em,x,y,size){
  ctx.font=size+"px serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(em,x,y);
  ctx.textAlign="left";ctx.textBaseline="alphabetic";
}
function drawEnemy(e){
  const t=e.type;
  const spr={wolf:"wolf",boar:"boar",ghost:"ghost",elite:"elite",boss:"boss"}[t.id]||"wolf";
  // 阴影
  ctx.fillStyle="rgba(0,0,0,.3)";
  ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*0.85,e.r*0.8,e.r*0.28,0,0,7);ctx.fill();
  // 悬浮/奔跑起伏
  const bob=Math.sin(G.t*7+e.x*0.1)*2;
  const alpha=t.id==="ghost"?0.8:(e.stun>0?0.65:1);
  drawSpr(spr,e.x,e.y+bob,e.r*2.6,alpha);
  if(e.stun>0){ // 麻痹：黄色火花环绕
    for(let i=0;i<3;i++){
      const a=G.t*5+i*2.09;
      const sx=e.x+Math.cos(a)*(e.r+8),sy=e.y-e.r+Math.sin(a)*5;
      ctx.fillStyle="#ffe066";ctx.beginPath();ctx.arc(sx,sy,2.5,0,7);ctx.fill();
    }
  }
  if(e.slowT>0){ctx.strokeStyle="#9ad8ff";ctx.globalAlpha=.6;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r+4,0,7);ctx.stroke();ctx.globalAlpha=1;}
  // 血条
  if(e.hp<e.maxhp){
    const w=Math.max(26,e.r*2);
    ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(e.x-w/2,e.y-e.r-12,w,4);
    ctx.fillStyle=t.id==="boss"?"#ffb347":"#e05c5c";
    ctx.fillRect(e.x-w/2,e.y-e.r-12,w*Math.max(0,e.hp/e.maxhp),4);
  }
}
function hud(){
  const p=G.p;
  document.getElementById("hpfill").style.width=(p.hp/p.maxhp*100)+"%";
  document.getElementById("hptext").textContent=`${Math.ceil(p.hp)} / ${Math.round(p.maxhp)}`;
  document.getElementById("xpfill").style.width=(p.xp/p.xpn*100)+"%";
  document.getElementById("lvl").textContent=realmName(p.lv)+"("+p.lv+")";
  document.getElementById("gems").textContent=(G.gemRun||0);
  document.getElementById("kills").textContent=G.kills;
  const m=(G.t/60|0),s=(G.t%60|0);
  document.getElementById("time").textContent=`${m}:${s<10?"0":""}${s}`;
  document.getElementById("wave").textContent=G.wave;
}
function renderSkillHud(){
  const el=document.getElementById("skillsHud");
  el.innerHTML=Object.entries(G.p.skills).map(([id,s])=>{
    const sk=SKILLS[id],dir=s.a||s.b?(s.a>=s.b?sk.a.name:sk.b.name):"未定向";
    return `<div class="sk"><span class="ico">${sk.icon}</span><span>${sk.name}<b style="color:var(--hi)">Lv${s.lv}</b></span><span class="dir">${dir}</span></div>`;
  }).join("");
}

/* ================= 日志/结算 ================= */
function log(msg){
  // 简易飘字
  if(G)G.fx.push({x:G.p.x,y:G.p.y-40,c:"#e6c86e",kind:"ring",r:20,life:1.2,t:1.2,msg});
  console.log("[御剑] "+msg);
}
function gameOver(){
  if(G.over)return;
  G.over=true;G.paused=true;
  const gemsEarned=G.gemRun||0;
  META.gems+=gemsEarned;saveMeta();
  const box=document.getElementById("overlayBox");
  box.innerHTML=`<h2 class="ot" style="background:linear-gradient(90deg,#a04,#f79,#a04);-webkit-background-clip:text;background-clip:text;">道 陨</h2>
    <p style="text-align:center;color:#8896ad;font-size:13px;margin:6px 0">
      坚守 <b style="color:#cde">${Math.floor(G.t/60)}分${Math.floor(G.t%60)}秒</b> ·
      ${realmName(G.p.lv)} · 击杀 <b style="color:#cde">${G.kills}</b> · 波次 <b style="color:#cde">${G.wave}</b></p>
    <p style="text-align:center;font-size:20px;margin:14px 0;color:var(--hi);text-shadow:0 0 12px #e6c86e44">💎 灵石 +${gemsEarned}</p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:8px">
      <button class="bigbtn" onclick="restart()">轮回再战</button>
      <button class="bigbtn alt" onclick="showCave()">洞府修炼</button>
    </div>`;
  document.getElementById("overlay").style.display="flex";
}
function restart(){
  document.getElementById("overlay").style.display="none";
  newGame();
}
/* ================= 洞府（元进度） ================= */
function showCave(){
  const box=document.getElementById("overlayBox");
  box.innerHTML=`<h2 class="ot">洞 府 · 长生大道</h2>
    <p style="text-align:center;font-size:17px;margin:8px 0;color:var(--hi);text-shadow:0 0 12px #e6c86e44">💎 ${META.gems}</p>
    <div id="mups"></div>
    <div style="text-align:center;margin-top:14px">
      <button class="bigbtn" onclick="restart()">出 战</button>
    </div>`;
  const c=box.querySelector("#mups");
  Object.entries(META_UPS).forEach(([k,u])=>{
    const lv=META.ups[k],maxed=lv>=u.max,cost=u.cost(lv);
    const d=document.createElement("div");
    d.className="upcard";
    d.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between">
      <div><span class="t" style="font-size:15px">${u.name}</span>
      <span style="color:#66748c;font-size:12px;margin-left:8px">Lv${lv}/${u.max}</span>
      <br><span style="color:#aeb9cc;font-size:12px">${u.desc}</span></div>
      <button ${maxed||META.gems<cost?"disabled":""} style="padding:8px 14px;border:none;border-radius:8px;font-size:14px;
        background:${maxed?"#3a4152":META.gems<cost?"#3a4152":"linear-gradient(180deg,#4a9d68,#357a4c)"};color:${maxed||META.gems<cost?"#778":"#fff"}">
        ${maxed?"圆满":`💎 ${cost}`}</button></div>`;
    d.querySelector("button").onclick=()=>{
      if(META.gems>=cost&&!maxed){META.gems-=cost;META.ups[k]++;saveMeta();showCave();}
    };
    c.appendChild(d);
  });
  document.getElementById("overlay").style.display="flex";
}
function saveMeta(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(META));}catch(e){}}
function showLevelTip(){banner("妖兽来袭！走位躲避，神通自施");}

/* ================= 按钮 ================= */
document.getElementById("btnPause").onclick=function(){
  if(!G)return;G.paused=!G.paused;this.textContent=G.paused?"继续":"暂停";
};

/* ================= 启动 ================= */
newGame();
window.onerror=function(msg,src,line){
  const b=document.getElementById("hpwrap");
  if(b)b.style.outline="2px solid #e05c5c";
  return false;
};
requestAnimationFrame(loop);
</script>
</body>
</html>
