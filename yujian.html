<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>御剑求生录 · 仙侠肉鸽</title>
<style>
  :root{--bg:#0a0d13;--panel:rgba(20,26,38,.92);--hi:#e6c86e;--ok:#7bc96f;--bad:#e05c5c;--blue:#7aa2c9;--line:#2a3550;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:#eee;
    font:14px/1.5 "Microsoft YaHei",sans-serif;touch-action:none;}
  canvas{display:block;position:absolute;inset:0;}
  /* ---- HUD 顶栏 ---- */
  #hud{position:absolute;top:10px;left:12px;right:12px;pointer-events:none;z-index:5;}
  #hpwrap{position:relative;height:18px;border-radius:9px;overflow:hidden;
    background:linear-gradient(#000c,#0009);border:1px solid #3a2030;box-shadow:0 2px 8px #0008;}
  #hpfill{height:100%;width:100%;border-radius:8px;
    background:linear-gradient(180deg,#f08a8a,#c03b3b 60%,#8f2424);transition:width .15s;}
  #hptext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#ffd;text-shadow:0 1px 2px #000;letter-spacing:1px;}
  #xpwrap{margin-top:4px;height:8px;border-radius:4px;overflow:hidden;background:#000a;border:1px solid #243a2a;}
  #xpfill{height:100%;width:0%;border-radius:4px;background:linear-gradient(90deg,#3f8f5a,#8fe0a8);transition:width .15s;}
  #hudinfo{margin-top:6px;font-size:12px;color:#cdd6e4;text-shadow:0 1px 3px #000;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  #hudinfo b{color:var(--hi);font-weight:600;}
  .pill{display:inline-flex;align-items:center;gap:4px;background:rgba(10,14,22,.62);
    border:1px solid var(--line);border-radius:20px;padding:2px 10px;backdrop-filter:blur(3px);}
  /* ---- 技能栏 ---- */
  #skillsHud{position:absolute;top:78px;left:12px;z-index:5;pointer-events:none;
    display:flex;flex-direction:column;gap:5px;}
  #skillsHud .sk{display:flex;align-items:center;gap:6px;background:rgba(12,16,26,.72);
    border:1px solid var(--line);border-left:3px solid var(--hi);border-radius:8px;
    padding:3px 9px 3px 6px;font-size:12px;color:#dde;backdrop-filter:blur(3px);}
  #skillsHud .sk .ico{font-size:15px;filter:drop-shadow(0 0 4px #e6c86e66);}
  #skillsHud .sk .dir{color:#9aa8c0;font-size:11px;}
  /* ---- 摇杆 ---- */
  #stick{position:absolute;right:20px;bottom:26px;width:104px;height:104px;border-radius:50%;
    border:1.5px solid rgba(140,170,230,.35);background:radial-gradient(circle,rgba(30,40,60,.35),rgba(10,14,22,.15));
    box-shadow:inset 0 0 24px #0006, 0 4px 18px #0007;z-index:10;transition:opacity .15s;touch-action:none;}
  #stick.live{border-color:rgba(170,200,255,.55);box-shadow:inset 0 0 24px #0006, 0 0 22px rgba(122,162,201,.25);}
  #stick::after{content:"";position:absolute;inset:22%;border-radius:50%;border:1px dashed rgba(140,170,230,.22);}
  stickKnob{position:absolute;left:29px;top:29px;width:46px;height:46px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#b9d4ff,#5f86c9 65%,#3c5a95);
    box-shadow:0 3px 12px #000a, inset 0 -4px 8px #0006, 0 0 14px #7aa2c955;
    transition:left .08s ease-out,top .08s ease-out;}
  /* ---- 圆形按钮 ---- */
  .cbtn{width:58px;height:58px;border-radius:50%;font-size:13px;color:#dce6f5;
    border:1.5px solid rgba(140,170,230,.4);background:radial-gradient(circle at 35% 30%,rgba(60,80,120,.85),rgba(20,28,44,.9));
    box-shadow:0 4px 14px #0008, inset 0 1px 2px #fff2;}
  .cbtn:active{transform:scale(.94);filter:brightness(1.2);}
  /* ---- 弹窗 ---- */
  #overlay{position:absolute;inset:0;background:rgba(4,6,10,.72);backdrop-filter:blur(4px);
    z-index:20;display:none;align-items:center;justify-content:center;}
  #overlayBox{background:var(--panel);border:1px solid var(--line);border-radius:16px;
    padding:22px;max-width:540px;width:92%;max-height:88vh;overflow-y:auto;
    box-shadow:0 20px 60px #000c, inset 0 1px 0 #ffffff14;}
  .upcard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:9px 0;
    cursor:pointer;background:linear-gradient(135deg,rgba(38,48,70,.5),rgba(20,26,40,.5));
    transition:border-color .12s, transform .12s, box-shadow .12s;}
  .upcard:hover{border-color:var(--hi);transform:translateY(-2px);
    box-shadow:0 6px 20px #0009, 0 0 18px #e6c86e22;}
  .upcard .t{font-size:16px;color:var(--hi);}
  .upcard .tagA{color:#e8b96a;border-color:#e8b96a66;}
  .upcard .tagB{color:#8fc1ee;border-color:#8fc1ee66;}
  .upsub{font-size:11px;border:1px solid;border-radius:10px;padding:0 8px;margin-left:8px;vertical-align:2px;}
  h2.ot{font-size:22px;letter-spacing:6px;text-align:center;
    background:linear-gradient(90deg,#c9a24a,#f5e3a0,#c9a24a);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .bigbtn{padding:12px 26px;border:none;border-radius:10px;font-size:16px;letter-spacing:4px;color:#fff;
    background:linear-gradient(180deg,#c94b3f,#9e2f26);box-shadow:0 4px 16px #000a, inset 0 1px 0 #fff3;}
  .bigbtn:active{transform:scale(.97);}
  .bigbtn.alt{background:linear-gradient(180deg,#3a5578,#263a55);}
</style>
</head>

const VW=800,VH=600; // 固定逻辑分辨率：所有设备同一张地图，渲染像素恒定（手机不因高分屏多画）
function resize(){
  W=VW;H=VH;cv.width=VW;cv.height=VH;
  // CSS 等比缩放适配屏幕（黑边 letterbox）
  const s=Math.min(innerWidth/VW,innerHeight/VH);
  cv.style.width=(VW*s)+"px";cv.style.height=(VH*s)+"px";
  cv.style.position="absolute";
  cv.style.left=((innerWidth-VW*s)/2)+"px";cv.style.top=((innerHeight-VH*s)/2)+"px";
  renderBg();
}
// 触摸坐标 → 逻辑世界坐标
function toWorld(clientX,clientY){
  const r=cv.getBoundingClientRect();
  return {x:(clientX-r.left)*(W/r.width),y:(clientY-r.top)*(H/r.height)};
}
addEventListener("resize",resize);resize(); // 立即执行一次适配

/* 预渲染辉光贴图：径向渐变只创建一次，绘制走 drawImage（GitHub 常用 canvas 优化手法） */
const GLOWS={};
function glow(c){
  if(GLOWS[c])return GLOWS[c];
  const g=document.createElement("canvas");
  const x=g.getContext?g.getContext("2d"):null;
  if(!x)return null; // 无 canvas 环境（测试桩）
  g.width=g.height=64;
  const hex=c.replace("#","");
  const rr=parseInt(hex.slice(0,2),16),gg=parseInt(hex.slice(2,4),16),bb=parseInt(hex.slice(4,6),16);
  const gr=x.createRadialGradient(32,32,2,32,32,32);
  gr.addColorStop(0,"rgba(255,255,255,0.95)");
  gr.addColorStop(0.35,c);
  gr.addColorStop(1,`rgba(${rr},${gg},${bb},0)`);
  x.fillStyle=gr;x.fillRect(0,0,64,64);
  GLOWS[c]=g;return g;
}
function drawGlow(c,x,y,r,a){
  const g=glow(c);if(!g)return;
  if(a!==undefined)ctx.globalAlpha=a;
  ctx.globalCompositeOperation="lighter"; // 叠加混合：霓虹发光（GPU 快速路径）
  ctx.drawImage(g,x-r,y-r,r*2,r*2);
  ctx.globalCompositeOperation="source-over";
  if(a!==undefined)ctx.globalAlpha=1;
}
function drawSpr(name,x,y,size,alpha){
  const img=SPR[name];
  if(alpha!==undefined&&alpha<1){ // 仅半透明时才动用状态栈
    ctx.save();ctx.globalAlpha=alpha;
    ctx.drawImage(img,x-size/2,y-size/2,size,size);
    ctx.restore();
  }else{
    ctx.drawImage(img,x-size/2,y-size/2,size,size);
  }
}

function metaMul(k,base){ // 元进度乘区
  const m={atk:1+META.ups.atk*0.08,hp:1+META.ups.hp*0.12,spd:1+META.ups.spd*0.04,
           xp:1+META.ups.xp*0.08}[k]||1;
  if(k==="atk"&&G){ // 境界成长 + 磨砺锋芒：功力随突破提升，后期伤害跟得上怪血

  }
  return base*m;
}

/* ================= 技能逻辑 ================= */
function grantSkill(id){G.p.skills[id]={lv:1,a:0,b:0};renderSkillHud();}
function skLv(id){return G.p.skills[id]?G.p.skills[id].lv:0;}

function castSkills(dt){
  const p=G.p;
  // 御剑术：飞向最近敌人
  if(p.skills.sword){
    const cd=Math.max(0.55,1.0-skLv("sword")*0.07);
    p.skills.sword.t=(p.skills.sword.t||0)-dt;
    if(p.skills.sword.t<=0){
      const n=1+(p.skills.sword.b||0);
      const pierce=2+(p.skills.sword.a||0)*2;
      const dmg=metaMul("atk",18+p.skills.sword.lv*5)*(1+(p.skills.sword.a||0)*0.3);
      const targets=nearestN(n);
      for(const e of targets){
        const ang=Math.atan2(e.y-p.y,e.x-p.x);
        G.shots.push({kind:"sword",x:p.x,y:p.y,vx:Math.cos(ang)*420,vy:Math.sin(ang)*420,
          dmg,pierce,hitset:new Set(),r:6,life:1.2});
      }
      // 进化·万剑归宗：绕体剑阵（常驻环绕，见 swordOrbitTick），施法照常
      p.skills.sword.t=cd;
    }
  }
  if(p.skills.sword&&p.skills.sword.evolved)swordOrbitTick(dt);
  // 掌心雷：随机敌人落雷
  if(p.skills.thunder){
    const s=p.skills.thunder;
    s.t=(s.t||0)-dt;
    if(s.t<=0&&G.enemies.length){
      const cd=(2.2-s.lv*0.1)*(1-(s.b||0)*0.3);
      const e=G.enemies[ri(0,G.enemies.length-1)];
      zap(e,p,metaMul("atk",11+s.lv*2.5),s.a||0);
      let cur=e,chain=s.a||0,used=new Set([e]);
      while(chain>0){
        const nx=G.enemies.filter(x=>!used.has(x)&&dist(x,cur)<160)[0];
        if(!nx)break;
        zap(nx,p,metaMul("atk",8+s.lv*2),0);used.add(nx);cur=nx;chain--;
      }
      if(s.b)G.enemies.forEach(x=>{if(dist(x,e)<90)x.stun=Math.max(x.stun||0,0.6);});
      // 进化·九天雷劫：额外轰击 3 只随机妖兽
      if(s.evolved){
        for(let i=0;i<3;i++){
          const t2=G.enemies[ri(0,G.enemies.length-1)];
          if(t2&&dist(t2,p)<420)zap(t2,p,metaMul("atk",7+s.lv*1.8),0);
        }
      }
      s.t=cd;
    }
  }
  // 丹火符
  if(p.skills.fire){
    const s=p.skills.fire;
    s.t=(s.t||0)-dt;
    if(s.t<=0&&G.enemies.length){
      const cd=2.5-s.lv*0.12;
      const n=1+(s.b||0)*2;
      const evoR=s.evolved?1.5:1, evoBurn=s.evolved||!!(s.a||0);
      for(let i=0;i<n;i++){
        const e=nearestN(1)[0]||G.enemies[0];
        const ang=Math.atan2(e.y-p.y,e.x-p.x)+rnd(-0.3,0.3);
        G.shots.push({kind:"fire",x:p.x,y:p.y,vx:Math.cos(ang)*300,vy:Math.sin(ang)*300,
          dmg:metaMul("atk",14+s.lv*5),r:8,life:1.5,burn:evoBurn,radius:46*(1+(s.a||0)*0.6)*evoR});
      }
      s.t=cd;
    }
  }
  // 寒冰箭
  if(p.skills.ice){
    const s=p.skills.ice;
    s.t=(s.t||0)-dt;
    if(s.t<=0&&G.enemies.length){
      const cd=2.0-s.lv*0.1;
      const e=nearestN(1)[0];
      const ang=Math.atan2(e.y-p.y,e.x-p.x);
      G.shots.push({kind:"ice",x:p.x,y:p.y,vx:Math.cos(ang)*380,vy:Math.sin(ang)*380,
        dmg:metaMul("atk",10+s.lv*3.5)*(1+(s.b||0)*0.8),r:6,life:1.4,freeze:s.a||0,slow:true});
      // 进化·冰狱寒渊：冰封周身 200 内妖兽
      if(s.evolved){
        G.enemies.forEach(x=>{if(dist(x,p)<200)x.stun=Math.max(x.stun||0,1);});
        fx(p.x,p.y,"#9ad8ff",200);
        spark(p.x,p.y,"#cfeaff",16,200); // 冰晶四溅
      }
      s.t=cd;
    }
  }
  // 回春诀：周期性回血
  if(p.skills.heal){
    const s=p.skills.heal;
    s.t=(s.t||0)-dt;
    if(s.t<=0){
      const cd=Math.max(2,(6-s.lv*0.3))*(1-(s.b||0)*0.4);
      const amt=(4+s.lv*2)*(1+(s.a||0)*0.6)*(s.evolved?2:1);
      p.hp=Math.min(p.maxhp,p.hp+amt);
      // 进化·长生大道：回血时获得 0.6 秒护体
      if(s.evolved)p.iframe=Math.max(p.iframe,0.6);
      G.fx.push({x:p.x+rnd(-6,6),y:p.y-24,c:"#8fe08f",kind:"dmg",life:0.7,t:0.7,txt:"+"+Math.round(amt)});
      fx(p.x,p.y,"#8fe08f",18);
      spark(p.x,p.y-6,"#a8e890",s.evolved?8:3,50,80); // 回春灵光上升
      s.t=cd;
    }
  }
}
function zap(e,p,dmg,chain){
  fx(e.x,e.y-30,"#8ef",10);hurtEnemy(e,dmg);
  spark(e.x,e.y,"#bfe8ff",3,110);
  G.fx.push({x:e.x,y:e.y,kind:"burst",c:"#bfe8ff",size:26,life:0.22,t:0.22});
  G.fx.push({x:e.x,y:e.y-120,x2:e.x,y2:e.y,kind:"bolt",life:0.18,t:0.18});
}
function nearestN(n){
  return [...G.enemies].filter(e=>dist(e,G.p)<280)
    .sort((a,b)=>dist(a,G.p)-dist(b,G.p)).slice(0,n);
}
/* 罡气护体：每帧环绕 */
function qiTick(dt){
  const p=G.p,s=p.skills.qi;if(!s)return;
  s.ang=(s.ang||0)+dt*(2.2+(s.b||0)*1.32);
  const n=1+s.lv-1+(s.a||0)+(s.evolved?3:0); // 进化·玄武真罡：+3 球
  s.orbs=[];const R=46*(1+(s.b||0)*0.35)*(s.evolved?1.4:1);
  s.ringR=R; // 供法阵绘制
  // 进化：罡内妖兽减速
  if(s.evolved)G.enemies.forEach(e=>{if(dist(e,p)<R+30)e.slowT=Math.max(e.slowT||0,0.3);});
  for(let i=0;i<n;i++){
    const a=s.ang+i*Math.PI*2/n;
    const ox=p.x+Math.cos(a)*R,oy=p.y+Math.sin(a)*R;
    s.orbs.push({x:ox,y:oy});
    G.enemies.forEach(e=>{
      if(dist(e,{x:ox,y:oy})<e.r+9){
        if(!e.qiCd||e.qiCd<=0){hurtEnemy(e,metaMul("atk",8+s.lv*3)*(1+(s.a||0)*0.3));e.qiCd=0.4;}
      }
    });
  }
}
function fx(x,y,c,r){G.fx.push({x,y,c,r:r||26,kind:"ring",life:0.3,t:0.3});}
function banner(txt){G.fx.push({x:W/2,y:H*0.3,kind:"banner",life:1.6,t:1.6,txt});}
/* ================= 万剑归宗·绕体剑阵 ================= */
function swordOrbitTick(dt){
  const p=G.p,s=p.skills.sword;
  s.oang=(s.oang||0)+dt*2.6; // 旋转角速度
  const R=74+(s.b||0)*3;   // 环半径随万剑方向微涨
  s.orbit={R,n:6};
  s.opos=[];
  const dmg=metaMul("atk",10+s.lv*3.2)*(1+(s.a||0)*0.25);
  for(let i=0;i<6;i++){
    const a=s.oang+i*Math.PI/3;
    const ox=p.x+Math.cos(a)*R,oy=p.y+Math.sin(a)*R;
    s.opos.push({x:ox,y:oy,a});
    // 触敌伤害（每敌 0.35 秒结算一次）
    G.enemies.forEach(e=>{
      if(dist(e,{x:ox,y:oy})<e.r+13){
        if(!e.swCd||e.swCd<=0){hurtEnemy(e,dmg);e.swCd=0.35;spark(ox,oy,"#e6c86e",1,90);}
      }
    });
  }
}
function drawSwordOrbit(){
  const p=G.p,s=p.skills.sword;
  if(!s||!s.evolved||!s.opos)return;
  for(const o of s.opos){
    const ang=o.a+Math.PI/2; // 剑尖朝旋转切线方向
    drawGlow("#e6c86e",o.x,o.y,16,0.5);
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(ang);
    ctx.fillStyle="#f2e2a0";
    ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(2,-3.4);ctx.lineTo(-9,-2);ctx.lineTo(-9,2);ctx.lineTo(2,3.4);ctx.closePath();ctx.fill();
    ctx.strokeStyle="#c9a24a";ctx.stroke();
    ctx.fillStyle="#e6c86e";ctx.fillRect(-12,-4,4,8);
    ctx.restore();
  }
}
/* 粒子：轻量发光点，总量封顶 */
function spark(x,y,c,n,spd,rise){
  if(G.parts.length>70)return; // 粒子上限收紧（移动端）
  for(let i=0;i<n;i++){
    const a=rnd(0,Math.PI*2),v=rnd(spd*0.3,spd);
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(rise||0),
      life:rnd(0.3,0.7),t:0.7,c,size:rnd(2,4)});
  }
}
function partsTick(dt){
  for(const q of G.parts){
    q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
    q.vx*=0.96;q.vy=q.vy*0.96+30*dt*(q.vy>0?1:0.2);
  }
  G.parts=G.parts.filter(q=>q.life>0);
  if(G.parts.length>70)G.parts.splice(0,G.parts.length-70);

/* ================= 场景机关：落雷 / 钩索 / 临时地形（Boss 召唤） ================= */
function summonRock(x,y,r,life,c){
  if(G.rocks.length>12)return; // 地形上限
  G.rocks.push({x,y,r,life,c:c||"#2a2f3d"});
}
function hazardTick(dt){
  const p=G.p;
  // 落雷：4 波起，每 3.5 秒一道，预判玩家附近
  if(G.wave>=4){
    G.hzT=(G.hzT||2)-dt;
    if(G.hzT<=0){
      G.hzT=3.5;
      G.hazards.push({kind:"thunder",x:p.x+rnd(-90,90),y:p.y+rnd(-90,90),r:58,tel:1.1});
    }
  }
  // 钩索：8 波起，每 6 秒一发，从屏幕边缘射向玩家
  if(G.wave>=8){
    G.hookT=(G.hookT||3)-dt;
    if(G.hookT<=0){
      G.hookT=6;
      const a=rnd(0,Math.PI*2),d=Math.max(W,H)*0.55;
      const sx=p.x+Math.cos(a)*d,sy=p.y+Math.sin(a)*d;
      const ang=Math.atan2(p.y-sy,p.x-sx);
      G.hazards.push({kind:"hook",x:sx,y:sy,sx,sy,
        vx:Math.cos(ang)*380,vy:Math.sin(ang)*380,dmg:8+G.wave});
    }
  }
  // 临时地形寿命衰减
  for(const rk of G.rocks)rk.life-=dt;
  G.rocks=G.rocks.filter(rk=>rk.life>0);
  for(const h of G.hazards){
    if(h.kind==="thunder"){
      h.tel-=dt;
      if(h.tel<=0&&!h.done){
        h.done=true;
        // 落雷命中判定
        if(dist(h,p)<h.r+p.r&&p.iframe<=0){
          p.hp-=14+G.wave*1.5;p.iframe=0.4;fx(p.x,p.y,"#e06c6c",40);
          G.shake=Math.max(G.shake||0,0.2);
          if(p.hp<=0)gameOver();
        }
        G.fx.push({x:h.x,y:h.y-160,x2:h.x,y2:h.y,kind:"bolt",life:0.25,t:0.25});
        fx(h.x,h.y,"#bfe8ff",h.r*0.7);
        spark(h.x,h.y,"#bfe8ff",5,140);
        h.dead=true;
      }
    }else if(h.kind==="hook"){
      h.x+=h.vx*dt;h.y+=h.vy*dt;
      h.life=(h.life||3)-dt;
      if(dist(h,p)<18+p.r){
        // 命中：拖拽玩家向钩子来向
        if(p.iframe<=0){
          p.hp-=h.dmg;p.iframe=0.5;
          const m=Math.hypot(h.vx,h.vy)||1;
          p.x=clamp(p.x+h.vx/m*180,16,W-16);
          p.y=clamp(p.y+h.vy/m*180,16,H-16);
          fx(p.x,p.y,"#e06c6c",34);
          G.shake=Math.max(G.shake||0,0.25);
          if(p.hp<=0)gameOver();
        }
        h.dead=true;
      }
      if(h.x<-80||h.x>W+80||h.y<-80||h.y>H+80||h.life<=0)h.dead=true;
    }
  }
  G.hazards=G.hazards.filter(h=>!h.dead);
}
function drawHazards(){
  // 临时地形岩石（Boss 召唤，随寿命渐隐）
  for(const rk of G.rocks){
    ctx.globalAlpha=Math.min(1,rk.life/1.5);
    ctx.fillStyle=rk.c;
    ctx.beginPath();ctx.arc(rk.x,rk.y,rk.r,0,7);ctx.fill();
    ctx.fillStyle=rk.c==="#3a6a8a"?"#5a9ac0":"#3a4152"; // 冰柱高光 / 石柱高光
    ctx.beginPath();ctx.arc(rk.x-rk.r*0.25,rk.y-rk.r*0.28,rk.r*0.62,0,7);ctx.fill();
    ctx.strokeStyle="#151822";ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;
    ctx.globalAlpha=1;
  }
  for(const h of G.hazards){
    if(h.kind==="thunder"){ // 红圈预警 → 收缩闪烁
      const k=1-h.tel/1.1;
      ctx.fillStyle=`rgba(220,50,50,${0.10+k*0.16})`;
      ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.fill();
      ctx.strokeStyle=`rgba(255,90,90,${0.5+k*0.4})`;
      ctx.lineWidth=2+k*1.5;
      ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,7);ctx.stroke();
      ctx.lineWidth=1;
    }else if(h.kind==="hook"){ // 飞爪 + 锁链
      const m=Math.hypot(h.vx,h.vy)||1;
      ctx.strokeStyle="#8a94a8";ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(h.x-h.vx/m*46,h.y-h.vy/m*46);ctx.lineTo(h.x,h.y);ctx.stroke();
      ctx.lineWidth=1;
      ctx.fillStyle="#c8d2e8";
      ctx.beginPath();ctx.arc(h.x,h.y,7,0,7);ctx.fill();
      ctx.strokeStyle="#5a6478";ctx.stroke();
    }
  }
}
/* 岩石碰撞推离（玩家与怪通用） */
function rockPush(o){
  for(const rk of G.rocks){
    let dx=o.x-rk.x,dy=o.y-rk.y;
    const d=Math.hypot(dx,dy);
    if(d<rk.r+(o.r||10)){
      if(d<0.01){const a=rnd(0,Math.PI*2);dx=Math.cos(a);dy=Math.sin(a);}
      else{dx/=d;dy/=d;}
      const push=rk.r+(o.r||10)-Math.max(d,0.01);
      o.x+=dx*push;o.y+=dy*push;
    }
  }
}

const ITEMS={
  magnet:{name:"聚灵珠",icon:"🧲",desc:"吸引全场灵气入体",c:"#a8e890"},

function dropItem(x,y,force){

function itemTick(dt){

    if(d<130){it.x+=(p.x-it.x)/d*220*dt;it.y+=(p.y-it.y)/d*220*dt;} // 缓慢漂向玩家

function drawItems(){

/* ================= 敌人 ================= */
function spawnWave(dt){
  G.spawnT-=dt;
  if(G.spawnT<=0){
    G.spawnT=Math.max(0.6,1.2-G.wave*0.06); // 基础刷怪速率 ×1.5
    const level=G.wave;
    // 阶梯难度：血量成长全面加码，防秒怪
    const hpMul=1+level*0.25+Math.max(0,level-5)*0.22+Math.max(0,level-15)*0.15;
    const spdMul=Math.min(2.0,1+Math.max(0,level-4)*0.03);
    const dmgMul=Math.min(3.5,1+Math.max(0,level-3)*0.055);
    if(G.enemies.length<60+Math.min(80,G.wave*6)){ // 场上限随波次增长（后期怪海封路）
      // 怪池随波次扩容：3波+妖蝠，5波+妖蛛，7波+骨将（排除所有 boss 与精英）
      const pool=ETYPES.filter(t=>!t.id.startsWith("boss")&&t.id!=="elite"
        && (t.id!=="bat"||level>=3) && (t.id!=="spider"||level>=5) && (t.id!=="skel"||level>=7));
      const t=pool[ri(0,pool.length-1)];
      for(let i=0;i<ri(2,3+Math.min(6,level/2.5|0));i++){ // 每批最多 9 只随波次增长
        const a=rnd(0,Math.PI*2),d=rnd(Math.max(W,H)*0.55,Math.max(W,H)*0.75);
        // 4 波后：部分怪从玩家附近刷新（绕圈风筝不再安全）
        let sx=W/2+Math.cos(a)*d, sy=H/2+Math.sin(a)*d;
        if(level>=4&&Math.random()<0.35){
          sx=clamp(G.p.x+Math.cos(a)*Math.max(W,H)*0.35,30,W-30);
          sy=clamp(G.p.y+Math.sin(a)*Math.max(W,H)*0.35,30,H-30);
        }
        G.enemies.push(mkEnemy(t,sx,sy,hpMul,spdMul,dmgMul));
      }
    }
  }
  G.eliteT-=dt;
  if(G.eliteT<=0){
    G.eliteT=35; // 波次更快
    G.wave++;
    if(G.wave%5===0){ // boss 波（每 5 波，四 Boss 轮换）
      const a=rnd(0,Math.PI*2),d=Math.max(W,H)*0.6;
      const bhp=1+G.wave*0.1;
      const bspd=Math.min(1.6,1+Math.max(0,G.wave-4)*0.025);
      const bdmg=Math.min(2.6,1+G.wave*0.03);
      const bosses=["boss","boss_lei","boss_xue","boss_bing"];
      const bt=ETYPES.find(t=>t.id===bosses[(Math.floor(G.wave/5)-1)%4]);
      G.enemies.push(mkEnemy(bt,W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,bhp,bspd,bdmg));
      if(G.wave>=10){ // 10 波后双 Boss（第二只为基础妖王）
        const a2=rnd(0,Math.PI*2);
        G.enemies.push(mkEnemy(ETYPES.find(t=>t.id==="boss"),W/2+Math.cos(a2)*d,H/2+Math.sin(a2)*d,bhp*0.7,bspd,bdmg));
      }
      banner(`⚠ ${bt.name} 降世 ⚠`);
      G.shake=Math.max(G.shake||0,0.35); // Boss 降世震屏
    }else if(G.wave>1){
      const a=rnd(0,Math.PI*2),d=Math.max(W,H)*0.6;
      const ehp=1+G.wave*0.08+Math.max(0,G.wave-5)*0.1;
      const espd=Math.min(2.0,1+Math.max(0,G.wave-4)*0.03);
      G.enemies.push(mkEnemy(ETYPES.find(t=>t.id==="elite"),W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,ehp,espd,Math.min(2.6,1+G.wave*0.035)));
      if(G.wave>=5){ // 5 波后精英成对
        const a2=rnd(0,Math.PI*2);
        G.enemies.push(mkEnemy(ETYPES.find(t=>t.id==="elite"),W/2+Math.cos(a2)*d,H/2+Math.sin(a2)*d,ehp*0.8,espd,Math.min(2.6,1+G.wave*0.035)));
      }
      if(G.wave>=8){ // 8 波后精英三连
        const a3=rnd(0,Math.PI*2);
        G.enemies.push(mkEnemy(ETYPES.find(t=>t.id==="elite"),W/2+Math.cos(a3)*d,H/2+Math.sin(a3)*d,ehp*0.7,espd,Math.min(2.6,1+G.wave*0.035)));
      }
      if(G.wave>=13){ // 13 波后精英四连
        const a4=rnd(0,Math.PI*2);
        G.enemies.push(mkEnemy(ETYPES.find(t=>t.id==="elite"),W/2+Math.cos(a4)*d,H/2+Math.sin(a4)*d,ehp*0.6,espd,Math.min(2.6,1+G.wave*0.035)));
      }
      banner(`第 ${G.wave} 波 · 妖将出击`);
    }
  }
}
function mkEnemy(t,x,y,hpMul,spdMul,dmgMul){
  spdMul=spdMul||1;dmgMul=dmgMul||1;
  return {type:t,hp:t.hp*hpMul,maxhp:t.hp*hpMul,x,y,spd:t.spd*spdMul*rnd(0.9,1.1),
    dmg:Math.round(t.dmg*dmgMul),r:t.r,stun:0,slowT:0,qiCd:0,hitCd:0};
}
function hurtEnemy(e,dmg){
  e.hp-=dmg;
  e.flashT=0.08; // 受击白闪反馈
  // 飘字限流：只显示高伤或抽样，且总量封顶（防低端机卡死）
  if(dmg>=1&&G.fx.length<50&&(dmg>=25||Math.random()<0.3))
    G.fx.push({x:e.x+rnd(-6,6),y:e.y-e.r-4,c:dmg>=30?"#ff9a54":"#ffe9b0",kind:"dmg",life:0.6,t:0.6,txt:Math.round(dmg)});
  if(e.hp<=0&&!e.dead){
    e.dead=true;G.kills++;
    const n=e.type.gem;G.gemRun=(G.gemRun||0)+n;
    // 4% 掉落回血丹；道具另算（精英 12%，妖王 80%）
    if(Math.random()<0.02)
      G.orbs.push({x:e.x,y:e.y,pill:true});
    else if(e.type.id==="elite"||e.type.id.startsWith("boss")){
      // 精英/妖王：大经验珠（经验随波次成长）
      G.orbs.push({x:e.x,y:e.y,big:true,v:e.type.xp*2*(1+G.wave*0.04)});
    }else{
      // 小怪经验也随波次成长
      const v=e.type.xp*(1+G.wave*0.04);
      for(let i=0;i<(v>4?4:1);i++)
        G.orbs.push({x:e.x+rnd(-12,12),y:e.y+rnd(-12,12),v:v/(v>4?4:1)});
    }
    if(e.type.id==="boss")dropItem(e.x,e.y,0.8);      // 妖王 80%
    else if(e.type.id==="elite")dropItem(e.x,e.y,0.12); // 妖将 12%
    else dropItem(e.x,e.y,0.006);                      // 普通怪 0.6%
    if(e.type.id==="boss_mie")victory(); // 斩杀灭世魔尊 = 飞升结局
    if(e.type.id.startsWith("boss")&&e.type.id!=="boss_mie"&&!G.over){
      // 斩杀 Boss：境界直接突破一级（含三选一）
      G.p.xp=G.p.xpn; gainXp(0.001);
      log(`斩杀 ${e.type.name}，道行大进，直接突破！`);
    }
  }
}
function enemyTick(dt){
  const p=G.p;
  for(const e of G.enemies){
    e.swCd=(e.swCd||0)-dt; // 剑阵结算冷却
    if(e.stun>0){e.stun-=dt;continue;}
    let sp=e.spd;
    if(e.slowT>0){e.slowT-=dt;sp*=0.45;}
    // Boss AI：特殊机制
    if(e.type.ai)bossAI(e,dt);
    // 冲刺中（玄冰巨蟒）
    if(e.dashT>0){
      e.dashT-=dt;
      e.x+=e.dashVx*dt;e.y+=e.dashVy*dt;
      // 冲刺路径留寒霜减速带
      if(Math.random()<0.4)G.fx.push({x:e.x,y:e.y,c:"#6ee8",r:30,kind:"zone",life:1.2,t:1.2,dps:0,slowZone:true});
      e.hitCd=Math.max(e.hitCd,0.3); // 冲刺贴身更疼
    }else{
      const d=dist(e,p)||1;
      e.x+=(p.x-e.x)/d*sp*dt;e.y+=(p.y-e.y)/d*sp*dt;
    }
    // 碰撞伤害
    e.hitCd-=dt;
    if(dist(e,p)<e.r+p.r&&e.hitCd<=0&&p.iframe<=0){
      const dmg=e.dashT>0?e.dmg*2:e.dmg; // 冲刺双倍
      e.hitCd=1.0;p.hp-=dmg;p.iframe=0.55;fx(p.x,p.y,"#e06c6c",30);
      G.shake=Math.max(G.shake||0,0.1); // 受击轻震
      if(p.hp<=0)gameOver();
    }
  }
  G.enemies=G.enemies.filter(e=>!e.dead);
  eshotTick(dt);
}
/* ================= Boss AI ================= */
function bossAI(e,dt){
  const p=G.p;
  e.aiT=(e.aiT===undefined?2.5:e.aiT)-dt;
  if(e.type.ai==="xue"&&dist(e,p)<320){ // 血魔老祖：近距离吸血
    p.hp=Math.max(0,p.hp-4*dt);
    e.hp=Math.min(e.maxhp,e.hp+3*dt);
  }
  if(e.aiT>0)return;
  e.aiT=e.type.aiCd;
  if(e.type.ai==="lei"){ // 雷罡妖王：环形弹幕 + 召唤石阵困杀
    fx(e.x,e.y,"#a6f",40);
    for(let i=0;i<10;i++){
      const a=i*Math.PI/5+rnd(-0.06,0.06);
      G.eshots.push({x:e.x,y:e.y,vx:Math.cos(a)*160,vy:Math.sin(a)*160,
        dmg:Math.round(e.dmg*0.9),r:7,life:4,c:"#c8a8ff"});
    }
    for(let i=0;i<6;i++)spark(e.x,e.y,"#c8a8ff",1,120);
    // 在玩家周围立起石柱（6 秒后消失），逼你从缝里钻
    const a0=rnd(0,Math.PI*2);
    for(let i=0;i<3;i++){
      const a=a0+i*2.09;
      summonRock(clamp(p.x+Math.cos(a)*95,30,W-30),clamp(p.y+Math.sin(a)*95,30,H-30),rnd(16,22),6,"#2a2f3d");
    }
  }else if(e.type.ai==="xue"){ // 血魔老祖：召唤妖蝠
    fx(e.x,e.y,"#f66",44);
    for(let i=0;i<4;i++){
      const a=rnd(0,Math.PI*2);
      if(G.enemies.length<75)G.enemies.push(mkEnemy(ETYPES.find(t=>t.id==="bat"),e.x+Math.cos(a)*50,e.y+Math.sin(a)*50,1+G.wave*0.1,1,1));
    }
  }else if(e.type.ai==="bing"){ // 玄冰巨蟒：锁定冲刺 + 沿途冰柱
    const d=dist(e,p)||1;
    e.dashT=0.55;e.dashVx=(p.x-e.x)/d*460;e.dashVy=(p.y-e.y)/d*460;
    fx(e.x,e.y,"#6ee",50);
    summonRock(e.x,e.y,rnd(13,17),4,"#3a6a8a"); // 冰柱 4 秒
  }else if(e.type.ai==="mie"){ // 灭世魔尊：弹幕 + 天劫倒计时
    for(let ring=0;ring<2;ring++)
      for(let i=0;i<12;i++){
        const a=i*Math.PI/6+ring*0.26+G.t;
        G.eshots.push({x:e.x,y:e.y,vx:Math.cos(a)*(150+ring*60),vy:Math.sin(a)*(150+ring*60),
          dmg:Math.round(e.dmg*0.8),r:8,life:5,c:"#ff8080"});
      }
    if(G.jieCd<=0){G.jieCd=18;G.jieWarn=3;} // 启动天劫
  }
}
/* 敌方弹幕 */
function eshotTick(dt){
  const p=G.p;
  for(const s of G.eshots){
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(dist(s,p)<s.r+p.r&&p.iframe<=0){
      p.hp-=s.dmg;p.iframe=0.45;fx(p.x,p.y,"#e06c6c",26);
      s.dead=true;
      if(p.hp<=0)gameOver();
    }
    if(s.x<-40||s.x>W+40||s.y<-40||s.y>H+40)s.dead=true;
  }
  G.eshots=G.eshots.filter(s=>!s.dead&&s.life>0);
}
/* 天劫（灭世魔尊）：倒计时后全场秒杀（金身符可挡） */
function jieTick(dt){
  if(G.jieCd>0)G.jieCd-=dt;
  if(G.jieWarn>0){
    G.jieWarn-=dt;
    if(G.jieWarn<=0){ // 天劫落下
      const alive=G.enemies.find(e=>e.type.ai==="mie"&&!e.dead);
      if(alive){ // 魔尊在场才降劫
        for(let i=0;i<10;i++)G.fx.push({x:rnd(0,W),y:-60,x2:rnd(0,W),y2:rnd(0,H),kind:"bolt",life:0.35,t:0.35});
        fx(G.p.x,G.p.y,"#ff4040",Math.max(W,H)*0.5);
        G.shake=Math.max(G.shake||0,0.5); // 天劫大震屏
        if(G.p.iframe<=0){ // 金身符是唯一解
          G.p.hp=-1;gameOver();
          banner("💀 天劫·身死道消");
        }else banner("✨ 金身护体·天劫不侵！");
        G.jieCd=18;
      }
    }
  }
}

/* ================= 弹道 ================= */
function shotTick(dt){
  for(const s of G.shots){
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
    if(s.kind==="fire"&&s.life<=0){explode(s);s.dead=true;continue;}
    for(const e of G.enemies){
      if(s.kind==="sword"&&s.hitset.has(e))continue;
      if(dist(s,e)<e.r+s.r){
        if(s.kind==="fire"){explode(s);s.dead=true;break;}
        hurtEnemy(e,s.dmg);
        if(s.slow){e.slowT=2;if(s.freeze){G.enemies.forEach(x=>{if(dist(x,e)<80)x.stun=Math.max(x.stun,1);});}}
        if(s.kind==="sword"){
          s.hitset.add(e);
          if(s.hitset.size>s.pierce){s.dead=true;break;}
        } else {s.dead=true;break;}
      }
    }
    if(s.x<-50||s.x>W+50||s.y<-50||s.y>H+50)s.dead=true;
  }
  G.shots=G.shots.filter(s=>!s.dead&&s.life>0);
}
function explode(s){
  fx(s.x,s.y,"#f94",s.radius);
  G.shake=Math.max(G.shake||0,0.12); // 爆炸小震
  G.fx.push({x:s.x,y:s.y,kind:"burst",c:"#ffb066",size:s.radius*0.9,life:0.35,t:0.35});
  spark(s.x,s.y,"#ffb066",8,160,60); // 火星升腾
  G.enemies.forEach(e=>{if(dist(e,s)<s.radius+e.r)hurtEnemy(e,s.dmg);});
  if(s.burn)G.fx.push({x:s.x,y:s.y,c:"#f74",r:s.radius,kind:"zone",life:2,t:2,dps:metaMul("atk",9)});
}

/* ================= 经验/升级 ================= */
function orbTick(dt){
  const p=G.p;
  for(const o of G.orbs){
    const d=dist(o,p);
    const pull=o.magnet?1600:300, range=o.magnet?9999:(p.magR||150); // 聚灵状态全场高速吸取
    if(d<range){o.x+=(p.x-o.x)/d*pull*dt;o.y+=(p.y-o.y)/d*pull*dt;}
    if(d<16){
      o.dead=true;
      if(o.pill){ // 回血丹：回复 25
        const heal=Math.min(12,p.maxhp-p.hp);
        p.hp+=heal;
        G.fx.push({x:p.x+rnd(-6,6),y:p.y-24,c:"#8fe08f",kind:"dmg",life:0.7,t:0.7,txt:"+"+Math.round(heal)});
      } else gainXp(o.v);
    }
  }
  G.orbs=G.orbs.filter(o=>!o.dead);
}
function gainXp(v){
  const p=G.p;p.xp+=v*metaMul("xp",1)*(p.xpBuff||1);
  while(p.xp>=p.xpn){
    p.xp-=p.xpn;p.lv++;p.xpn=Math.round(p.xpn*1.33+3);
    p.maxhp+=10;p.hp=Math.min(p.maxhp,p.hp+p.maxhp*0.2); // 突破回 20% 血
    levelUpModal();
  }
}
function resetInput(){
  input.x=input.y=0;input.kx=input.ky=0;input.mag=0;
  try{ stickReset(); }catch(e){}
}
function levelUpModal(){
  G.paused=true;
  resetInput(); // 弹窗时释放摇杆，防止 touchend 被弹窗吃掉导致输入卡死
  showUpgrades();
}
function showUpgrades(){
  const opts=rollUpgrades();
  const box=document.getElementById("overlayBox");
  box.innerHTML=`<h2 class="ot">突破 · ${realmName(G.p.lv)}</h2>
    <p style="text-align:center;color:#8896ad;font-size:12px;margin:4px 0 10px">道心抉择，三选其一</p><div id="ups"></div>
    <div style="text-align:center;margin-top:6px">
      <button id="rerollBtn" class="bigbtn alt" style="padding:8px 20px;font-size:14px;letter-spacing:2px" ${G.rerolls<=0?"disabled":""}>🔄 重抽天机（剩 ${G.rerolls} 次）</button>
    </div>`;
  const c=box.querySelector("#ups");
  opts.forEach(o=>{
    const d=document.createElement("div");
    d.className="upcard";
    d.innerHTML=`<span class="t">${o.title}</span><span class="upsub ${o.sub==="方向A"?"tagA":o.sub==="方向B"?"tagB":o.sub==="★进化"?"tagA":""}">${o.sub}</span><br>
      <span style="color:#aeb9cc;font-size:13px">${o.desc}</span>`;
    d.onclick=()=>{o.apply();G.paused=false;
      document.getElementById("overlay").style.display="none";
      renderSkillHud();saveMeta();};
    c.appendChild(d);
  });
  box.querySelector("#rerollBtn").onclick=()=>{
    if(G.rerolls<=0)return;
    G.rerolls--;
    showUpgrades(); // 重抽一轮新选项
  };
  document.getElementById("overlay").style.display="flex";
}
/* ================= 技能进化（Lv6 满级后解锁，改变形态） ================= */
const EVO={
  sword:{name:"万剑归宗·剑阵",desc:"每次施放额外激发 8 剑环射全场",
    apply:s=>{s.evolved=true;}},
  thunder:{name:"九天雷劫",desc:"每击额外轰击 4 只随机妖兽",
    apply:s=>{s.evolved=true;}},
  fire:{name:"焚天火海",desc:"爆炸范围 +50%，且必留灼烧地带",
    apply:s=>{s.evolved=true;}},
  ice:{name:"冰狱寒渊",desc:"每次施放冰封周身 200 内妖兽 1 秒",
    apply:s=>{s.evolved=true;}},
  qi:{name:"玄武真罡",desc:"罡气球 +3 且范围 +40%，罡内妖兽减速",
    apply:s=>{s.evolved=true;}},
  heal:{name:"长生大道",desc:"回复量翻倍，且回血时获得 0.6 秒护体",
    apply:s=>{s.evolved=true;}},
};
function rollUpgrades(){
  const p=G.p,pool=[];
  // 候选1：未拥有的新技能
  Object.keys(SKILLS).filter(id=>!p.skills[id]).forEach(id=>{
    pool.push({key:"new:"+id,title:`${SKILLS[id].icon} 习得「${SKILLS[id].name}」`,sub:"新技能",
      desc:SKILLS[id].desc,apply:()=>grantSkill(id)});
  });
  // 候选2：已有技能升级（Lv1 的 A/B 各自独立入池）
  Object.keys(p.skills).forEach(id=>{
    const s=p.skills[id],sk=SKILLS[id];
    if(s.lv<6){
      if(s.lv===1){
        pool.push({key:"sk:"+id+"A",title:`${sk.icon}「${sk.name}」→ ${sk.a.name}`,sub:"方向A",desc:sk.a.desc,
          apply:()=>{s.lv++;s.a=(s.a||0)+1;}});
        pool.push({key:"sk:"+id+"B",title:`${sk.icon}「${sk.name}」→ ${sk.b.name}`,sub:"方向B",desc:sk.b.desc,
          apply:()=>{s.lv++;s.b=(s.b||0)+1;}});
      }else{
        const mainA=s.a>=s.b;
        if(Math.random()<0.25&&((mainA&&s.b===0)||(!mainA&&s.a===0))){
          const key=mainA?"b":"a",br=mainA?sk.b:sk.a;
          pool.push({key:"sk:"+id+key,title:`${sk.icon}「${sk.name}」→ ${br.name}`,sub:"转向",desc:br.desc,
            apply:()=>{s.lv++;s[key]=1;}});
        }else{
          pool.push({key:"sk:"+id+"m",title:`${sk.icon}「${sk.name}」精进`,sub:`${mainA?sk.a.name:sk.b.name} Lv${s.lv}`,
            desc:`${mainA?sk.a.desc:sk.b.desc}（效果叠加）`,
            apply:()=>{s.lv++;if(mainA)s.a++;else s.b++;}});
        }
      }
    }
  });
  // 候选3：满级技能的进化（高优先）
  Object.keys(p.skills).forEach(id=>{
    const s=p.skills[id];
    if(s.lv>=6&&!s.evolved){
      const e=EVO[id];
      pool.push({key:"evo:"+id,title:`${SKILLS[id].icon}「${SKILLS[id].name}」进化 · ${e.name}`,sub:"★进化",
        desc:e.desc,apply:()=>{e.apply(s);banner(`${SKILLS[id].icon} ${e.name}！`);}});
    }
  });
  // 候选4：通用强化
  const gens=[
    ["❤ 淬炼肉身","生命上限 +25，并回满",()=>{p.maxhp+=25;p.hp=p.maxhp;}],
    ["🗡 磨砺锋芒","全伤害 +15%",()=>{p.atkBuff=(p.atkBuff||1)*1.15;}],
    ["👟 步罡踏斗","移速 +10%",()=>{p.spd*=1.10;}],
    ["🔮 摄灵之瞳","灵气吸取范围 +40%",()=>{p.magR=(p.magR||150)*1.4;}],
    ["☯ 悟性顿开","灵气获取 +12%",()=>{p.xpBuff=(p.xpBuff||1)*1.12;}],
  ];
  gens.forEach(g=>pool.push({key:"gen:"+g[0],title:g[0],sub:"通用",desc:g[1],apply:g[2]}));
  // 选卡：进化优先 → 避开上一次出过的卡 → 同技能去重 → 补满 3 张
  const recent=(G.recentOffers||[]);
  const pick3=(avoid)=>{
    const evo=pool.find(o=>o.sub==="★进化"&&!avoid.includes(o.key));
    const rest=pool.filter(o=>o!==evo&&!avoid.includes(o.key));
    // 洗牌 rest
    for(let i=rest.length-1;i>0;i--){const j=ri(0,i);[rest[i],rest[j]]=[rest[j],rest[i]];}
    const picks=evo?[evo]:[];
    const usedSkills=new Set(picks.map(o=>o.key.split(":")[1]));
    for(const o of rest){
      if(picks.length>=3)break;
      const skillId=o.key.split(":")[1];
      if(usedSkills.has(skillId))continue; // 同技能只出一张卡
      picks.push(o);usedSkills.add(skillId);
    }
    return picks.slice(0,3);
  };
  let picks=pick3(recent);
  if(picks.length<3)picks=pick3([]); // 池子太小就放弃避让
  G.recentOffers=picks.map(o=>o.key); // 记住这次出过的，下次尽量换新
  return picks;
}

const input={x:0,y:0};
addEventListener("keydown",e=>{
  if(e.key==="w"||e.key==="ArrowUp")input.ky=-1;
  if(e.key==="s"||e.key==="ArrowDown")input.ky=1;
  if(e.key==="a"||e.key==="ArrowLeft")input.kx=-1;
  if(e.key==="d"||e.key==="ArrowRight")input.kx=1;
});
addEventListener("keyup",e=>{
  if(e.key==="w"||e.key==="s"||e.key==="ArrowUp"||e.key==="ArrowDown")input.ky=0;
  if(e.key==="a"||e.key==="d"||e.key==="ArrowLeft"||e.key==="ArrowRight")input.kx=0;
});
const stick=document.getElementById("stick"),knob=document.getElementById("stickKnob");
let stickId=null,stickCX=0,stickCY=0;
const STICK_R=52, KNOCK_R=29, DEAD=0.14; // 摇杆半径/旋钮复位/死区
function stickCenter(cx,cy){ // 浮动摇杆：把底盘挪到手指落点（换算到逻辑坐标）
  const w=toWorld(cx,cy);
  stickCX=w.x;stickCY=w.y;
  stick.style.left=(cx-STICK_R)+"px";stick.style.top=(cy-STICK_R)+"px"; // DOM 用屏幕坐标
  stick.style.right="auto";stick.style.bottom="auto";
  stick.classList.add("live");
}
function stickReset(){
  stickId=null;input.x=input.y=0;input.mag=0;
  knob.style.left=KNOCK_R+"px";knob.style.top=KNOCK_R+"px";
  stick.classList.remove("live");
  stick.style.left="";stick.style.top="";
  stick.style.right="20px";stick.style.bottom="26px"; // 回到右下待命位
}
function stickMove(t){
  const w=toWorld(t.clientX,t.clientY);
  let dx=w.x-stickCX,dy=w.y-stickCY;
  const m=Math.hypot(dx,dy);
  if(m>STICK_R){dx=dx/m*STICK_R;dy=dy/m*STICK_R;}
  knob.style.left=(KNOCK_R+dx)+"px";knob.style.top=(KNOCK_R+dy)+"px";
  // 归一化偏移（含幅度，供模拟量速度）
  input.x=dx/STICK_R;input.y=dy/STICK_R;input.mag=Math.min(1,m/STICK_R);
}
// 触屏：按在屏幕任意非按钮区域即出现浮动摇杆
addEventListener("touchstart",e=>{
  if(stickId!==null)return;
  const t=e.changedTouches[0];
  const el=document.elementFromPoint(t.clientX,t.clientY);
  if(el&&(el.closest("button")||el.closest("#overlay")))return; // 按钮/弹窗不触发
  stickId=t.identifier;
  stickCenter(t.clientX,t.clientY);
  stickMove(t);
  e.preventDefault();
},{passive:false});
addEventListener("touchmove",e=>{for(const t of e.changedTouches)if(t.identifier===stickId)stickMove(t);e.preventDefault();},{passive:false});
addEventListener("touchend",e=>{for(const t of e.changedTouches)if(t.identifier===stickId)stickReset();});
addEventListener("touchcancel",e=>{for(const t of e.changedTouches)if(t.identifier===stickId)stickReset();});
// 鼠标（桌面调试）：按住任意位置拖动
addEventListener("mousedown",e=>{
  if(stickId!==null)return;
  const el=e.target;
  if(el&&(el.closest&&el.closest("button")))return;
  stickId="m";stickCenter(e.clientX,e.clientY);stickMove(e);
});
addEventListener("mousemove",e=>{if(stickId==="m")stickMove(e);});
addEventListener("mouseup",()=>{if(stickId==="m")stickReset();});

/* ================= 主循环 ================= */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
  if(G&&!G.paused&&!G.over){
    tick(dt);
  }
  draw();
}
function tick(dt){
  G.t+=dt;
  const p=G.p;
  // 移动（模拟量：死区 14%，幅度线性映射到速度）；玄冰寒霜带减速 45%
  let mx=input.x||(input.kx||0),my=input.y||(input.ky||0);
  let frost=1;
  for(const f of G.fx)if(f.kind==="zone"&&f.slowZone&&dist(p,{x:f.x,y:f.y})<f.r)frost=0.55;
  const mm=Math.hypot(mx,my);
  let mag=input.kx||input.ky ? 1 : (input.mag||mm);
  if(mm>0.01&&mag<DEAD)mag=0;
  if(mm>0.01&&mag>DEAD){
    const speedScale=Math.min(1,(mag-DEAD)/(1-DEAD)*1.15); // 过死区后快速到全速
    const v=speedScale*p.spd*frost;
    p.x=clamp(p.x+mx/mm*v*dt,16,W-16);p.y=clamp(p.y+my/mm*v*dt,16,H-16);
  }
  p.iframe=Math.max(0,p.iframe-dt);
  p.hp=Math.min(p.maxhp,p.hp+(0.2+META.ups.regen*0.5)*dt); // 基础回血 0.2/秒
  castSkills(dt);qiTick(dt);
  spawnWave(dt);enemyTick(dt);shotTick(dt);orbTick(dt);itemTick(dt);
  partsTick(dt);jieTick(dt);hazardTick(dt);
  // 岩石阻挡玩家
  rockPush(p);
  // 15 分钟后精英持续增援（解决后期升级慢）
  if(G.t>900){
    G.eliteSpT=(G.eliteSpT||15)-dt;
    if(G.eliteSpT<=0){
      G.eliteSpT=G.t>1200?12:18;
      const a=rnd(0,Math.PI*2),d=Math.max(W,H)*0.6;
      G.enemies.push(mkEnemy(ETYPES.find(t=>t.id==="elite"),W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,
        1+G.wave*0.08,1,Math.min(2.6,1+G.wave*0.035)));
      if(G.t>1200){ // 20 分钟后双精英增援
        const a2=rnd(0,Math.PI*2);
        G.enemies.push(mkEnemy(ETYPES.find(t=>t.id==="elite"),W/2+Math.cos(a2)*d,H/2+Math.sin(a2)*d,
          1+G.wave*0.08,1,Math.min(2.6,1+G.wave*0.035)));
      }
    }
  }
  // 30 分钟终局：灭世魔尊降世
  if(G.t>=1800&&!G.finalSpawned&&!G.victory){
    G.finalSpawned=true;
    const a=rnd(0,Math.PI*2),d=Math.max(W,H)*0.4;
    G.enemies.push(mkEnemy(ETYPES.find(t=>t.id==="boss_mie"),W/2+Math.cos(a)*d,H/2+Math.sin(a)*d,3,1.1,3));
    banner("💀 天劫·灭世魔尊降世 💀");
    log("撑过 30 分钟了……但真正的劫数才刚开始");
    G.jieCd=12; // 12 秒后第一道天劫
  }
  hudT=Math.max(0,hudT-dt);
  // 灵气球溢出保护：超 150 个时旧的自动飞向玩家（防堆积卡顿）
  if(G.orbs.length>150)for(let i=0;i<G.orbs.length-150;i++)G.orbs[i].magnet=true;
  // 灼烧地带
  for(const f of G.fx)if(f.kind==="zone")
    G.enemies.forEach(e=>{if(dist(e,f)<f.r)e.hp-=f.dps*dt,e.hp<=0&&!e.dead&&hurtEnemy(e,0.01);});
  G.fx.forEach(f=>{f.life-=dt;});
  G.fx=G.fx.filter(f=>f.life>0);
  if(G.fx.length>70)G.fx.splice(0,G.fx.length-70); // 特效硬上限，防堆积
  hud();
}

/* ================= 渲染 ================= */
// 静态背景离屏缓存：渐变/云纹/星点只画一次，每帧一张 drawImage
function renderBg(){
  bgCv=document.createElement("canvas");bgCv.width=W;bgCv.height=H;
  const c=bgCv.getContext?bgCv.getContext("2d"):null;
  if(!c){bgOk=false;return;} // 无 canvas 环境（测试桩）时走旧路径
  const bg=c.createRadialGradient(W/2,H*0.42,0,W/2,H*0.42,Math.max(W,H)*0.8);
  bg.addColorStop(0,"#131a2a");bg.addColorStop(1,"#070a10");
  c.fillStyle=bg;c.fillRect(0,0,W,H);
  c.globalAlpha=0.5;c.fillStyle="#1a2334";
  for(let i=0;i<26;i++){const x=(i*211.7)%W,y=(i*137.3)%H;
    c.beginPath();c.ellipse(x,y,26,5,0,0,7);c.fill();}
  c.globalAlpha=0.8;c.fillStyle="#2c3a55";
  for(let i=0;i<48;i++){const x=(i*173.3)%W,y=(i*97.7)%H;c.fillRect(x,y,2,2);}
  c.globalAlpha=1;
  bgOk=true;
}
function draw(){
  ctx.imageSmoothingEnabled=false; // 像素风全局设置一次，不再每精灵切换
  if(bgOk){
    ctx.drawImage(bgCv,0,0); // 一张图搞定背景
  }else{
    // 兜底：直接绘制
    const bg=ctx.createRadialGradient(W/2,H*0.42,0,W/2,H*0.42,Math.max(W,H)*0.8);
    bg.addColorStop(0,"#131a2a");bg.addColorStop(1,"#070a10");
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=0.5;ctx.fillStyle="#1a2334";
    for(let i=0;i<26;i++){const x=(i*211.7)%W,y=(i*137.3)%H;
      ctx.beginPath();ctx.ellipse(x,y,26,5,0,0,7);ctx.fill();}
    ctx.globalAlpha=0.8;ctx.fillStyle="#2c3a55";
    for(let i=0;i<48;i++){const x=(i*173.3)%W,y=(i*97.7)%H;ctx.fillRect(x,y,2,2);}
    ctx.globalAlpha=1;
  }
  if(!G){return;}
  // 屏幕震动：Boss降世/爆炸/天劫
  ctx.save();
  if(G.shake>0){G.shake-=1/60;ctx.translate(rnd(-1,1)*G.shake*14,rnd(-1,1)*G.shake*14);}
  const p=G.p;
  // 灵气球/回血丹
  for(const o of G.orbs){
    const by=o.y+Math.sin(G.t*5+o.x)*2;
    if(o.pill){ // 回血丹：红十字圆丹
      ctx.fillStyle="#e05c5c44";ctx.beginPath();ctx.arc(o.x,by,10,0,7);ctx.fill();
      ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(o.x,by,6,0,7);ctx.fill();
      ctx.fillStyle="#d03838";
      ctx.fillRect(o.x-4,by-1.5,8,3);ctx.fillRect(o.x-1.5,by-4,3,8);
    }else if(o.big){ // 大经验珠：金色脉动（辉光贴图）
      const pu=1+Math.sin(G.t*6+o.x)*0.15;
      drawGlow("#e6c86e",o.x,by,15*pu,0.9);
      ctx.fillStyle="#fff6d0";ctx.beginPath();ctx.arc(o.x,by-2,4,0,7);ctx.fill();
    }else{
      ctx.fillStyle="#7bc96f44";ctx.beginPath();ctx.arc(o.x,by,9,0,7);ctx.fill();
      ctx.fillStyle="#a8e890";
      ctx.beginPath();ctx.moveTo(o.x,by-6);ctx.lineTo(o.x+4,by);ctx.lineTo(o.x,by+6);ctx.lineTo(o.x-4,by);ctx.closePath();ctx.fill();
      ctx.fillStyle="#e8ffd8";ctx.beginPath();ctx.arc(o.x,by-2,1.5,0,7);ctx.fill();
    }
  }
  // 机关层（岩石/落雷预警/钩索）画在敌人下面
  drawHazards();
  // 灼烧地带先画（在敌人下面）
  for(const f of G.fx)if(f.kind==="zone"){
    ctx.fillStyle=f.c;ctx.globalAlpha=0.16;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();
    ctx.globalAlpha=0.5;ctx.strokeStyle=f.c;ctx.stroke();ctx.globalAlpha=1;
  }
  // 敌人：按种类分形状（含岩石推离）
  for(const e of G.enemies){
    rockPush(e);
    drawEnemy(e);
  }
  // 弹幕：程序绘制，飞剑转向飞行方向（环形剑阵走轻量路径）
  for(const s of G.shots){
    const ang=Math.atan2(s.vy,s.vx);
    if(s.ring){ // 环形剑：单层剑形，无拖尾光晕
      ctx.save();ctx.translate(s.x,s.y);ctx.rotate(ang);
      ctx.fillStyle="#f2e2a0";
      ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(-7,-3);ctx.lineTo(-7,3);ctx.closePath();ctx.fill();
      ctx.restore();
      continue;
    }
    ctx.save();ctx.translate(s.x,s.y);
    if(s.kind==="sword"){
      ctx.rotate(ang);
      // 剑形：银刃金柄
      ctx.fillStyle="#dfe9ff";
      ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(2,-3.4);ctx.lineTo(-8,-2);ctx.lineTo(-8,2);ctx.lineTo(2,3.4);ctx.closePath();ctx.fill();
      ctx.strokeStyle="#9ab8ff";ctx.stroke();
      ctx.fillStyle="#e6c86e";ctx.fillRect(-11,-4,4,8);
    }else if(s.kind==="fire"){
      // 火符：旋转火球带尾焰
      ctx.rotate(G.t*8);
      const g=ctx.createRadialGradient(0,0,1,0,0,10);
      g.addColorStop(0,"#fff2b0");g.addColorStop(.5,"#ff9a3c");g.addColorStop(1,"#e04a10");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();
    }else if(s.kind==="ice"){
      // 冰晶：六角星
      ctx.rotate(G.t*3);
      ctx.strokeStyle="#cfeaff";ctx.lineWidth=2;
      for(let i=0;i<3;i++){ctx.rotate(Math.PI/3);
        ctx.beginPath();ctx.moveTo(-8,0);ctx.lineTo(8,0);ctx.stroke();}
      ctx.fillStyle="#eaf7ff";ctx.beginPath();ctx.arc(0,0,3,0,7);ctx.fill();
      ctx.lineWidth=1;
    }
    ctx.restore();
    // 拖尾光晕
    ctx.fillStyle=s.kind==="sword"?"#dce8ff33":s.kind==="fire"?"#ff9a5433":"#9ad8ff33";
    ctx.beginPath();ctx.arc(s.x-s.vx*0.02,s.y-s.vy*0.02,s.r+3,0,7);ctx.fill();
  }
  // 罡气球
  if(p.skills.qi&&p.skills.qi.orbs){
    for(const o of p.skills.qi.orbs){
      ctx.fillStyle="rgba(138,187,255,.30)";
      ctx.beginPath();ctx.arc(o.x,o.y,12,0,7);ctx.fill();
      ctx.fillStyle="#cfe2ff";ctx.beginPath();ctx.arc(o.x,o.y,5,0,7);ctx.fill();
      ctx.strokeStyle="#eaf3ff";ctx.stroke();
    }
  }
  // 主角：修士贴图 + 灵光（预渲染辉光）
  const pulse=1+Math.sin(G.t*4)*0.08;
  drawGlow("#e6c86e",p.x,p.y,p.r*2.6*pulse,0.55);
  // 玄武真罡：脚下旋转法阵
  if(p.skills.qi&&p.skills.qi.evolved){
    const R=p.skills.qi.ringR||64;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(G.t*0.8);
    ctx.strokeStyle="rgba(138,187,255,.5)";ctx.lineWidth=2;ctx.setLineDash([10,7]);
    ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.stroke();
    ctx.strokeStyle="rgba(190,220,255,.25)";ctx.setLineDash([4,9]);
    ctx.beginPath();ctx.arc(0,0,R*0.6,0,7);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
  }
  // 万剑归宗·绕体剑阵（玩家身边）
  drawSwordOrbit();
  drawSpr("player",p.x,p.y+Math.sin(G.t*6)*1.5,40,p.iframe>0&&(G.t*20|0)%2===0?0.45:1);
  drawItems();
  // 敌方弹幕：预渲染辉光贴图（不再逐帧建渐变）
  for(const s of G.eshots){
    drawGlow(s.c,s.x,s.y,s.r*2.4);
  }
  // 粒子：辉光贴图
  for(const q of G.parts){
    drawGlow(q.c,q.x,q.y,q.size*3.2,Math.max(0,q.life/q.t));
  }
  // 天劫预警：红屏渐强 + 倒计时
  if(G.jieWarn>0){
    const k=1-G.jieWarn/3;
    const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.25,W/2,H/2,Math.max(W,H)*0.7);
    vg.addColorStop(0,"rgba(200,20,20,0)");vg.addColorStop(1,`rgba(200,20,20,${0.25+k*0.4})`);
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    ctx.font="bold 42px 'Microsoft YaHei'";ctx.textAlign="center";
    ctx.fillStyle="#ff6a6a";ctx.shadowColor="#f00";ctx.shadowBlur=16;
    ctx.fillText(`天 劫 ${Math.ceil(G.jieWarn)}`,W/2,H*0.24);
    ctx.shadowBlur=0;ctx.textAlign="left";
  }
  // 特效
  for(const f of G.fx){
    const k=f.life/(f.t||0.3);
    if(f.kind==="ring"){
      ctx.strokeStyle=f.c;ctx.globalAlpha=k;ctx.lineWidth=2.5;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1.4-k*0.4),0,7);ctx.stroke();
      ctx.globalAlpha=1;ctx.lineWidth=1;
    }else if(f.kind==="bolt"){
      ctx.strokeStyle="#bfe8ff";ctx.globalAlpha=k;ctx.lineWidth=3.5;
      ctx.shadowColor="#8ef";ctx.shadowBlur=8;
      ctx.beginPath();ctx.moveTo(f.x,f.y);
      let x=f.x,y=f.y;
      for(let i=0;i<4;i++){x+=rnd(-14,14);y+=(f.y2-f.y)/4;ctx.lineTo(x,y);}
      ctx.lineTo(f.x2,f.y2);ctx.stroke();
      ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.lineWidth=1;
    }else if(f.kind==="dmg"){ // 伤害飘字
      ctx.globalAlpha=Math.min(1,k*1.4);
      ctx.font="bold 13px sans-serif";ctx.fillStyle=f.c||"#ffd";ctx.textAlign="center";
      ctx.fillText(f.txt,f.x,f.y-(1-k)*26);
      ctx.globalAlpha=1;ctx.textAlign="left";
    }else if(f.kind==="burst"){ // 爆闪
      ctx.globalAlpha=k*0.9;
      const r=f.size*(1.6-k*0.6);
      const g=ctx.createRadialGradient(f.x,f.y,1,f.x,f.y,r);
      g.addColorStop(0,"#ffffff");g.addColorStop(0.4,f.c);g.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,r,0,7);ctx.fill();
      ctx.globalAlpha=1;
    }else if(f.kind==="banner"){
      ctx.globalAlpha=Math.min(1,k*2);
      ctx.font="bold 26px 'Microsoft YaHei'";ctx.textAlign="center";
      ctx.shadowColor="#000";ctx.shadowBlur=10;
      ctx.fillStyle="#e6c86e";ctx.fillText(f.txt,W/2,f.y);
      ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.textAlign="left";
    }
  }
  ctx.restore(); // 震屏结束
}
function drawEmoji(em,x,y,size){
  ctx.font=size+"px serif";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(em,x,y);
  ctx.textAlign="left";ctx.textBaseline="alphabetic";

function drawEnemy(e){
  const t=e.type;
  const spr={wolf:"wolf",boar:"boar",ghost:"ghost",bat:"bat",spider:"spider",skel:"skel",elite:"elite",boss:"boss",
    boss_lei:"boss_lei",boss_xue:"boss_xue",boss_bing:"boss_bing",boss_mie:"boss_mie"}[t.id]||"wolf";
  // 阴影（怪海时跳过，省一次椭圆填充）
  if(G.enemies.length<90){
    ctx.fillStyle="rgba(0,0,0,.3)";
    ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*0.85,e.r*0.8,e.r*0.28,0,0,7);ctx.fill();
  }
  // 受击白闪
  if(e.flashT>0){
    e.flashT-=1/60;
    ctx.fillStyle=`rgba(255,255,255,${e.flashT*6})`;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r*1.05,0,7);ctx.fill();
  }
  // 悬浮/奔跑起伏
  const bob=Math.sin(G.t*7+e.x*0.1)*2;
  const alpha=t.id==="ghost"?0.8:(e.stun>0?0.65:1);
  drawSpr(spr,e.x,e.y+bob,e.r*2.6,alpha);
  if(e.stun>0){ // 麻痹：黄色火花环绕
    for(let i=0;i<3;i++){
      const a=G.t*5+i*2.09;
      const sx=e.x+Math.cos(a)*(e.r+8),sy=e.y-e.r+Math.sin(a)*5;
      ctx.fillStyle="#ffe066";ctx.beginPath();ctx.arc(sx,sy,2.5,0,7);ctx.fill();
    }
  }
  if(e.slowT>0){ctx.strokeStyle="#9ad8ff";ctx.globalAlpha=.6;
    ctx.beginPath();ctx.arc(e.x,e.y,e.r+4,0,7);ctx.stroke();ctx.globalAlpha=1;}
  // 血条
  if(e.hp<e.maxhp){
    const w=Math.max(26,e.r*2);
    ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(e.x-w/2,e.y-e.r-12,w,4);
    ctx.fillStyle=t.id==="boss"?"#ffb347":"#e05c5c";
    ctx.fillRect(e.x-w/2,e.y-e.r-12,w*Math.max(0,e.hp/e.maxhp),4);
  }
}
let hudT=0;
function hud(){
  if(hudT>0)return; hudT=0.15; // 节流：约 6.6 次/秒，避免每帧重排
  const p=G.p;
  document.getElementById("hpfill").style.width=(p.hp/p.maxhp*100)+"%";
  document.getElementById("hptext").textContent=`${Math.ceil(p.hp)} / ${Math.round(p.maxhp)}`;
  document.getElementById("xpfill").style.width=(p.xp/p.xpn*100)+"%";
  document.getElementById("lvl").textContent=realmName(p.lv)+"("+p.lv+")";
  document.getElementById("gems").textContent=(G.gemRun||0);
  document.getElementById("kills").textContent=G.kills;
  const m=(G.t/60|0),s=(G.t%60|0);
  document.getElementById("time").textContent=`${m}:${s<10?"0":""}${s}`;
  document.getElementById("wave").textContent=G.wave;
}
function renderSkillHud(){
  const el=document.getElementById("skillsHud");
  el.innerHTML=Object.entries(G.p.skills).map(([id,s])=>{
    const sk=SKILLS[id];
    const dir=s.evolved?`★${EVO[id].name}`:(s.a||s.b?(s.a>=s.b?sk.a.name:sk.b.name):"未定向");
    return `<div class="sk"${s.evolved?' style="border-left-color:#f0a"':""}><span class="ico">${sk.icon}</span><span>${sk.name}<b style="color:var(--hi)">Lv${s.lv}</b></span><span class="dir"${s.evolved?' style="color:#f8a"':""}>${dir}</span></div>`;
  }).join("");
}

/* ================= 日志/结算 ================= */
function log(msg){
  // 简易飘字
  if(G)G.fx.push({x:G.p.x,y:G.p.y-40,c:"#e6c86e",kind:"ring",r:20,life:1.2,t:1.2,msg});
  console.log("[御剑] "+msg);
}
function victory(){
  if(G.victory||G.over)return;
  G.victory=true;G.paused=true;
  const bonus=500+G.kills;
  META.gems+=bonus+(G.gemRun||0);saveMeta();
  const box=document.getElementById("overlayBox");
  box.innerHTML=`<h2 class="ot">羽 化 飞 升</h2>
    <p style="text-align:center;color:#cdd6e4;margin:10px 0">斩灭世魔尊于 ${Math.floor(G.t/60)} 分${Math.floor(G.t%60)} 秒 · ${realmName(G.p.lv)} · 击杀 ${G.kills} · 波次 ${G.wave}</p>
    <p style="text-align:center;font-size:22px;margin:14px 0;color:var(--hi);text-shadow:0 0 16px #e6c86e66">💎 灵石 +${bonus+(G.gemRun||0)}</p>
    <p style="text-align:center;color:#8896ad;font-size:12px">此界再无敌手。轮回再战，可挑战更快飞升。</p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:10px">
      <button class="bigbtn" onclick="restart()">轮回再战</button>
      <button class="bigbtn alt" onclick="showCave()">洞府修炼</button>
    </div>`;
  document.getElementById("overlay").style.display="flex";
}
function gameOver(){
  if(G.over)return;
  G.over=true;G.paused=true;
  resetInput();
  const gemsEarned=G.gemRun||0;
  META.gems+=gemsEarned;saveMeta();
  const box=document.getElementById("overlayBox");
  box.innerHTML=`<h2 class="ot" style="background:linear-gradient(90deg,#a04,#f79,#a04);-webkit-background-clip:text;background-clip:text;">道 陨</h2>
    <p style="text-align:center;color:#8896ad;font-size:13px;margin:6px 0">
      坚守 <b style="color:#cde">${Math.floor(G.t/60)}分${Math.floor(G.t%60)}秒</b> ·
      ${realmName(G.p.lv)} · 击杀 <b style="color:#cde">${G.kills}</b> · 波次 <b style="color:#cde">${G.wave}</b></p>
    <p style="text-align:center;font-size:20px;margin:14px 0;color:var(--hi);text-shadow:0 0 12px #e6c86e44">💎 灵石 +${gemsEarned}</p>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:8px">
      <button class="bigbtn" onclick="restart()">轮回再战</button>
      <button class="bigbtn alt" onclick="showCave()">洞府修炼</button>
    </div>`;
  document.getElementById("overlay").style.display="flex";
}
function restart(){
  document.getElementById("overlay").style.display="none";
  newGame();
}
/* ================= 洞府（元进度） ================= */
function showCave(){
  const box=document.getElementById("overlayBox");
  box.innerHTML=`<h2 class="ot">洞 府 · 长生大道</h2>
    <p style="text-align:center;font-size:17px;margin:8px 0;color:var(--hi);text-shadow:0 0 12px #e6c86e44">💎 ${META.gems}</p>
    <div id="mups"></div>
    <div style="text-align:center;margin-top:14px">
      <button class="bigbtn" onclick="restart()">出 战</button>
    </div>`;
  const c=box.querySelector("#mups");
  Object.entries(META_UPS).forEach(([k,u])=>{
    const lv=META.ups[k],maxed=lv>=u.max,cost=u.cost(lv);
    const d=document.createElement("div");
    d.className="upcard";
    d.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between">
      <div><span class="t" style="font-size:15px">${u.name}</span>
      <span style="color:#66748c;font-size:12px;margin-left:8px">Lv${lv}/${u.max}</span>
      <br><span style="color:#aeb9cc;font-size:12px">${u.desc}</span></div>
      <button ${maxed||META.gems<cost?"disabled":""} style="padding:8px 14px;border:none;border-radius:8px;font-size:14px;
        background:${maxed?"#3a4152":META.gems<cost?"#3a4152":"linear-gradient(180deg,#4a9d68,#357a4c)"};color:${maxed||META.gems<cost?"#778":"#fff"}">
        ${maxed?"圆满":`💎 ${cost}`}</button></div>`;
    d.querySelector("button").onclick=()=>{
      if(META.gems>=cost&&!maxed){META.gems-=cost;META.ups[k]++;saveMeta();showCave();}
    };
    c.appendChild(d);
  });
  document.getElementById("overlay").style.display="flex";
}
function saveMeta(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(META));}catch(e){}}
function showLevelTip(){banner("妖兽来袭！走位躲避，神通自施");}

/* ================= 按钮 ================= */
document.getElementById("btnPause").onclick=function(){
  if(!G)return;G.paused=!G.paused;this.textContent=G.paused?"继续":"暂停";
};
// 切后台自动暂停，回来不会暴毙
document.addEventListener("visibilitychange",function(){
  if(document.hidden&&G&&!G.over){G.paused=true;
    document.getElementById("btnPause").textContent="继续";}
});

/* ================= 启动 ================= */
newGame();
window.onerror=function(msg,src,line){
  const b=document.getElementById("hpwrap");
  if(b)b.style.outline="2px solid #e05c5c";
  return false;
};
requestAnimationFrame(loop);
</script>
