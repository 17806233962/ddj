<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小强倒爷记</title>
<style>
  :root { --bg:#0d0f0c; --fg:#b8c9a8; --dim:#5c6b52; --good:#8fd67a; --bad:#e07a5f; --warn:#e6c86e; --accent:#88b04b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Cascadia Mono",Consolas,"Microsoft YaHei",monospace; font-size:15px; line-height:1.6; }
  #wrap { max-width:860px; margin:0 auto; padding:16px 20px 80px; }
  h1 { color:var(--accent); letter-spacing:2px; font-size:20px; border-bottom:1px dashed var(--dim); padding-bottom:8px; }
  #status { border:1px solid var(--dim); padding:8px 12px; margin-bottom:12px; white-space:pre-wrap; }
  #log { border:1px solid var(--dim); padding:8px 12px; height:340px; overflow-y:auto; white-space:pre-wrap; margin-bottom:12px; }
  .good { color:var(--good); } .bad { color:var(--bad); } .warn { color:var(--warn); } .dim { color:var(--dim); }
  h2 { color:var(--accent); font-size:15px; margin:14px 0 6px; }
  table { border-collapse:collapse; width:100%; margin-bottom:10px; }
  td, th { border:1px solid var(--dim); padding:3px 8px; font-size:13px; }
  th { color:var(--accent); text-align:left; }
  button { background:transparent; color:var(--fg); border:1px solid var(--accent); font:inherit; font-size:13px; padding:2px 10px; margin:2px 2px 2px 0; cursor:pointer; }
  button:hover { background:var(--accent); color:var(--bg); }
  button:disabled { color:var(--dim); border-color:var(--dim); cursor:not-allowed; }
  button:disabled:hover { background:transparent; color:var(--dim); }
  input[type=number] { width:70px; background:var(--bg); color:var(--fg); border:1px solid var(--dim); font:inherit; font-size:13px; padding:1px 4px; }
  #actions { border:1px solid var(--dim); padding:10px 12px; }
  .end { font-size:18px; color:var(--warn); }
  .tblwrap { overflow-x:auto; }
  /* 手机适配 */
  @media (max-width: 640px){
    body { font-size:14px; }
    #wrap { padding:10px 10px 60px; }
    h1 { font-size:16px; letter-spacing:1px; }
    #log { height:240px; padding:6px 8px; font-size:13px; }
    #status { font-size:13px; white-space:normal; }
    td, th { padding:4px 5px; font-size:12px; white-space:nowrap; }
    input[type=number] { width:58px; }
    button { padding:6px 12px; min-height:32px; } /* 触控友好 */
    #actions button { margin:4px 4px 4px 0; }
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>小强倒爷记 —— 五城倒货 40 天</h1>
  <div id="status"></div>
  <div id="log"></div>
  <div id="market"></div>
  <div id="actions"></div>
</div>
<script>
"use strict";
// ==================== 数据 ====================
const TOTAL_DAYS = 40;
const ITEMS = [
  { id:1, name:"廊坊驴肉火烧",        base:8,    range:12,   desc:"便宜顶饱，走量起步" },
  { id:2, name:"德州扒鸡(真空装)",    base:45,   range:60,   desc:"铁路沿线硬通货" },

  { id:4, name:"青岛啤酒(塑料袋装)",  base:60,   range:120,  desc:"波动大，旺季暴涨" },

  { id:8, name:"黄油碟片",            base:800,  range:1500, desc:"灰色生意，波动剧烈" },

const CITIES = ["青岛","廊坊","德州","济南","南京"];

// ==================== 佳人系统 ====================
const WOMEN = {
  "青岛": { name:"晓雪", title:"啤酒妹", lines:{
    chat:["晓雪擦着杯子冲你一笑：“又来啦？今天生啤给你多打半杯。”","晓雪：“海边风大，你少喝点凉的。”"],
    dinner:["你请晓雪吃了顿海鲜，她吃得眉开眼笑。","两人坐在栈桥边吹海风，晓雪话比平时多。"],
    gift:["晓雪拆开礼物愣了一下：“你……还挺用心。”","晓雪把礼物收进抽屉最里面，耳朵有点红。"],

    dinner:["你俩蹲在摊子后分一只扒鸡，巧云笑得直不起腰。","巧云带你回了趟老家，她娘一个劲儿给你夹菜。"],
    gift:["巧云捧着礼物半天没说话，转头多给你包了三只鸡腿。","巧云：“俺不要这些……但俺收下了。”"],

  "济南": { name:"婉清", title:"泉边才女", lines:{

    dinner:["你请婉清吃了顿把子肉，她第一次没提‘斯文’二字。","婉清教你在泉边煮茶，煮着煮着天就黑了。"],
    gift:["婉清展开礼物，轻声说：“这份心意，我记账上了——用一生还的那种。”","婉清回赠你一首诗，藏在信封里，你没敢当街看。"],

  }},
  "南京": { name:"如玉", title:"秦淮佳人", lines:{
    chat:["如玉隔着窗问你：“外面的世界，可还热闹？”","如玉摇着团扇：“你来了，秦淮河都亮三分。”"],
    dinner:["你请如玉吃了顿盐水鸭，她笑你吃相，又给你剥了一只。","秦淮河上画舫夜游，如玉指着一处宅子说想有个家。"],
    gift:["如玉收下礼物，眸光流转：“你倒是大方。可我更想问你的一句话是……”","如玉把礼物摆在妆台正中央，说是‘镇台之宝’。"],
    brawl:["地痞砸了如玉的摊子，小强跟三个大汉周旋到底。她替你拭血：“呆子。”"],
    marry:["如玉凤冠霞帔：“从今往后，秦淮河畔，你是我的软肋与铠甲。”"],
  }},
};
// 成婚被动加成
const WIFE_PERK = {
  "晓雪":"特殊货火车站查获率 15% → 5%",
  "巧云":"疗养免费，且每次赶路自动回复 3 点健康",
  "婉清":"普通商品出手不打折（95折→原价）",
  "如玉":"NPC 进货价打 8 折，开黑市费用减半",
};
// 成就：key -> [名称, 描述]
const ACHVS = {
  marry1:   ["洞房花烛","首次成婚"],
  marry4:   ["齐人之福","四位佳人全部娶回家"],
  repayAll: ["无债一身轻","还清村长的所有欠款"],
  rich:     ["百万倒爷","结局净资产达到 100000"],
  seized:   ["查无此人","被火车站查获过至少一次"],
  rank:     ["必玩常客","进过必玩榜且活了下来"],
  died:     ["风流鬼","抱着佳人入眠时客死他乡"],
  broke:    ["白手起家","结局前现金和存款几乎归零又翻到 10000+"],
};

// ==================== 排行榜配置（Pantry 全服共享榜）====================
// 使用方法（一次性）：
//   1. 用浏览器打开游戏页面，F12 控制台运行 createPantry()
//   2. 控制台会输出 pantry ID，填到下面引号里并重新部署
//   3. 如果连不上 getpantry.cloud，排行榜自动降级为"本机榜"，不影响游戏
const PANTRY_ID = "";
const BASKET_API = id => `https://api.getpantry.cloud/pantry/${id}/basket/scores`;
// 特殊 NPC 黑市：付费解锁，只卖不买（货可以带到任何城市卖）
const NPCS = {
  "青岛": { name:"陈润刚", fee:2000, goods:[
    { id:"q1", name:"群勃龙",         buy:1200, sellBase:2400 },
    { id:"q2", name:"康力龙",         buy:800,  sellBase:1700 },
  ]},
  "德州": { name:"王胜举", fee:2500, goods:[
    { id:"d1", name:"黄金炒茄子",     buy:1800, sellBase:4200 },
    { id:"d2", name:"无线收音机",     buy:2600, sellBase:5400 },
  ]},
  "济南": { name:"张震", fee:3000, goods:[
    { id:"j1", name:"绝版迈腾子",     buy:3000, sellBase:6200 },
    { id:"j2", name:"稀有的牙",       buy:2200, sellBase:4600 },
  ]},
  "南京": { name:"禹发", fee:4000, goods:[
    { id:"n1", name:"夫子庙夜明珠",   buy:5000, sellBase:10500 },
    { id:"n2", name:"明孝陵金砖",     buy:4000, sellBase:9000 },
  ]},
};
const PRICE_EVENTS = [
  { text:"德州站前广场排起长队，扒鸡被抢购一空！",        item:2, mul:3 },
  { text:"美食博主探店把子肉，济南把子肉全网爆火！",      item:3, mul:4 },
  { text:"啤酒节开幕！青岛啤酒供不应求，价格狂飙！",      item:4, mul:4 },
  { text:"《舌尖》剧组拍了铁锅，章丘铁锅一夜封神！",      item:6, mul:5 },
  { text:"漫展人山人海，斐济杯一夜脱销，价格起飞！",      item:7, mul:3 },
  { text:"碟友圈疯传绝版资源，黄油碟片被炒上天价！",      item:8, mul:4 },
  { text:"养生专家直播吹爆蛇草水，割韭菜无数！",          item:5, mul:6 },
  { text:"物流恢复，外地火烧大量涌入，价格崩了。",        item:1, div:3 },
  { text:"工厂直营店杀进漫展，斐济杯价格跳水。",          item:7, div:4 },
  { text:"啤酒节结束，青岛啤酒大量滞销。",                item:4, div:5 },
  { text:"铁路高速化，沿线特产不再稀缺，扒鸡跌价。",      item:2, div:4 },
  { text:"章丘铁锅被曝机器量产，信仰崩塌，价格跳水。",    item:6, div:5 },
  { text:"扫黄打非专项行动，碟片市场风声鹤唳，价格崩了。", item:8, div:4 },
];
const CASH_EVENTS = [
  { text:"火车站口一个汉子拦住你：\"兄弟，给点钱用！\"",      pct:10 },
  { text:"一个大爷碰了你一下：\"别撞了！\"然后要医药费。",    pct:40 },
  { text:"三个戴红袖章的大妈揪住你：\"外地人？罚款！\"",      pct:20 },
  { text:"中介说：\"办暂住证，交点手续费。\"",                pct:15 },
  { text:"你在夜市吃串被多收了钱，还不敢吭声。",              pct:10 },
  { text:"城管来了，你的摊子被掀，货损惨重。",                pct:25 },
];

// ==================== 状态 ====================
let S = null;
const rnd = n => Math.floor(Math.random()*n);
const pick = arr => arr[rnd(arr.length)];

function priceOf(item){ return item.base + rnd(item.range + 1); }
function newMarket(city){ city = city || S.city; return ITEMS.map(it => ({ id:it.id, price:S.prices[city][it.id] })); }
function rollPrices(){ // 单城初始价格
  const p = {};
  for (const it of ITEMS) p[it.id] = priceOf(it);
  return p;
}
function driftPrices(city){ // 该城价格在其自身上次价格基础上 ±25% 漂移
  const p = S.prices[city];
  for (const it of ITEMS){
    let np = Math.round(p[it.id] * (0.75 + rnd(51)/100));
    const maxP = (it.base + it.range) * 2;
    p[it.id] = Math.max(1, Math.min(maxP, np));
  }
}
function newSpecialPrices(){ // 特殊货出手行情：0.35~1.55 倍基准——低位会跌破进货价，囤货有风险
  const p = {};
  for (const c in NPCS) for (const g of NPCS[c].goods)
    p[g.id] = Math.max(1, Math.round(g.sellBase * (0.35 + rnd(121)/100)));
  return p;
}

function initState(){
  return {
    day: 1, city: "青岛", cash: 2000, debt: 5500, health: 100,
    bag: {}, // itemId -> {qty, avg}（普通商品 id 为数字，特殊货为字符串）
    capacity: 100,
    prices: {}, // 各城独立价格：城市 -> 商品id -> 价格
    market: [],
    specialPrices: newSpecialPrices(),
    npcUnlocked: {}, // 已付费解锁的黑市：城市名 -> true
    npcStock: {},    // NPC 本次供货量：货id -> 剩余件数（换城补货）
    favor: {},       // 佳人好感度：名字 -> 0~100
    married: [],     // 已成婚的佳人
    chatToday: {},   // 今日已聊天：名字 -> true
    tickets: 0,      // 手里的彩票张数（换城后开奖）
    achv: [],        // 已达成成就 key
    ended: false, journal: [],
  };
}

// ==================== 成就 ====================
function grant(key){
  if (S.achv.includes(key) || !ACHVS[key]) return;
  S.achv.push(key);
  log(`🎉 达成成就【${ACHVS[key][0]}】—— ${ACHVS[key][1]}`, "good");
}

// ==================== 日志 ====================
function log(text, cls){
  const el = document.getElementById("log");
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.textContent = `【第${S.day}天·${S.city}】${text}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

// ==================== 核心逻辑 ====================
function bagUsed(){ return Object.values(S.bag).reduce((s,e)=>s+e.qty,0); }

function travel(dest){
  if (S.ended || dest === S.city) return;
  S.day += 1;
  S.city = dest;
  S.market = newMarket();
  log(`小强坐上了去${dest}的车……`, "dim");
  drawLottery(); // 上一城的彩票开奖

  // 债务利息
  if (S.debt > 0){
    const interest = Math.floor(S.debt * 15 / 100);
    S.debt += interest;
    if (interest > 0) log(`村长托人带话：欠款利息 +${interest}，现在欠 ${S.debt} 元。`, "warn");
  }
  // 各城价格独立漂移 + 特殊货行情刷新
  if (!S.prices[dest]) S.prices[dest] = rollPrices(); // 首次到达的城，掷初始价
  driftPrices(dest);
  S.market = newMarket(dest);
  S.specialPrices = newSpecialPrices();
  // NPC 补货：每样特殊货 5 件，卖完要等下次换城
  S.npcStock = {};
  if (NPCS[dest]) for (const g of NPCS[dest].goods) S.npcStock[g.id] = 5;
  // 巧云成婚：赶路时顺路照看小强
  if (S.married.includes("巧云") && S.health > 0 && S.health < 100){
    S.health = Math.min(100, S.health + 3);
    log(`💊 巧云塞给小强一包卤味和伤药：“路上不许亏待自己。”健康 +3`, "good");
  }
  // 成就：白手起家（落魄过又爬起来）
  if (S.cash < 100) S.wasBroke = true;
  if (S.wasBroke && S.cash >= 10000) grant("broke");

  // 火车站安检：黑市货（⭐特殊货）有几率被整批查获（晓雪成婚则 15% → 5%）
  const seizeRate = S.married.includes("晓雪") ? 5 : 15;
  for (const id of Object.keys(S.bag)){
    if (typeof id !== "string") continue;
    if (rnd(100) < seizeRate){
      grant("seized");
      const g = findSpecial(id);
      const e = S.bag[id];
      const loss = (S.specialPrices[id] || g.sellBase) * e.qty;
      delete S.bag[id];
      log(`🚔 火车站安检口被拦下！${e.qty} 件${g.name}被查获没收（价值约 ${loss} 元），小强眼睁睁看着货被搬走……`, "bad");
    }
  }

  // 商业事件（60% 概率）
  if (rnd(10) < 6){
    const ev = pick(PRICE_EVENTS);
    const q = S.market.find(m => m.id === ev.item);
    const item = ITEMS.find(i => i.id === ev.item);
    if (ev.mul) q.price = Math.round(q.price * ev.mul);
    else q.price = Math.max(1, Math.round(q.price / ev.div));
    S.prices[S.city][ev.item] = q.price; // 事件价记入本城价格基线
    log(`📰 ${ev.text}（${item.name} 现价 ${q.price}）`, "warn");
  }

  // 现金事件（35% 概率）
  if (rnd(20) < 7 && S.cash > 0){
    const ev = pick(CASH_EVENTS);
    const loss = Math.floor(S.cash * ev.pct / 100);
    S.cash -= loss;
    log(`💸 ${ev.text}（现金 -${loss}）`, "bad");
  }

  // 欠款太多被揍
  if (S.debt > 100000){
    S.health -= 30;
    log(`👊 小强欠钱太多，村长叫老乡们把小强揍了一顿！（健康 -30）`, "bad");
  }

  // 终局判定
  if (S.health <= 0){
    log("小强倒在了路边，日记本上写着：\"这条线，我还会再来的！\"", "bad");
    endGame("died");
    return;
  }
  if (S.day >= TOTAL_DAYS){
    endGame("timeup");
    return;
  }
  if (S.day === TOTAL_DAYS - 1) log("⏰ 明天就是最后一天了，快清仓回乡！", "warn");
  render();
}

// ======== 价格辅助：难度来自买卖差价（黑市收货 +8%，出手 -10%）========
function findSpecial(id){
  for (const c in NPCS){ const g = NPCS[c].goods.find(g => g.id === id); if (g) return g; }
  return null;
}
function buyUnitPrice(id){
  if (typeof id === "string") return findSpecial(id).buy;       // 特殊货：NPC 固定价
  const q = S.market.find(m => m.id === id);
  return Math.ceil(q.price * 1.08);                              // 普通货：加价 8% 收
}
function sellUnitPrice(id){
  if (typeof id === "string") return S.specialPrices[id] || 0;   // 特殊货：每日浮动行情
  const q = S.market.find(m => m.id === id);
  if (S.married.includes("婉清")) return q.price;                // 婉清执笔吆喝：出手不打折
  return Math.floor(q.price * 0.95);                             // 普通货：出手 95 折
}

function buy(id, qty){
  if (qty <= 0) return;
  let unit, name, maxByStock = Infinity;
  if (typeof id === "string"){ // 特殊货：只能在货主城市、且已解锁黑市时购买
    const npc = NPCS[S.city];
    const g = npc && npc.goods.find(g => g.id === id);
    if (!g){ log("这里没人卖这个货。", "bad"); return; }
    if (!S.npcUnlocked[S.city]){ log(`先找到${npc.name}付钱开黑市。`, "bad"); return; }
    const stock = S.npcStock[id] || 0;
    if (stock <= 0){ log(`${npc.name}两手一摊：“这批货出完了，等下批。”（换城补货）`, "bad"); return; }
    unit = S.married.includes("如玉") ? Math.round(g.buy * 0.8) : g.buy; // 如玉成婚打 8 折
    name = g.name;
    maxByStock = stock;
  } else {
    unit = buyUnitPrice(id);
    name = ITEMS.find(i => i.id === id).name;
  }
  const free = S.capacity - bagUsed();
  const maxAffordable = Math.floor(S.cash / unit);
  const maxQty = Math.min(free, maxAffordable, maxByStock);
  if (qty > maxQty){
    if (maxQty <= 0){ log(free === 0 ? "背包满了。" : maxAffordable === 0 ? "现金不够。" : `${name}这批只剩 ${maxByStock} 件了。`, "bad"); return; }
    qty = maxQty;
    const why = free < maxAffordable && free <= maxByStock ? "背包格数" : maxByStock <= maxAffordable ? "NPC 库存" : "现金";
    log(`数量超出上限，自动改为买 ${qty} 件（受${why}限制）。`, "warn");
  }
  const cost = unit * qty;
  const e = S.bag[id] || { qty:0, avg:0 };
  e.avg = Math.round((e.avg*e.qty + unit*qty) / (e.qty+qty));
  e.qty += qty;
  S.bag[id] = e;
  S.cash -= cost;
  if (typeof id === "string") S.npcStock[id] -= qty;
  log(`买了 ${qty} 件${name}，单价 ${unit}，花 ${cost} 元（均价 ${e.avg}）。`);
  render();
}

function sell(id, qty){
  const e = S.bag[id];
  if (!e || qty <= 0) return;
  if (qty > e.qty) qty = e.qty;
  const unit = sellUnitPrice(id);
  const item = findSpecial(id) || ITEMS.find(i => i.id === id);
  const earn = unit * qty;
  const profit = (unit - e.avg) * qty;
  e.qty -= qty;
  if (e.qty === 0) delete S.bag[id];
  S.cash += earn;
  log(`卖出 ${qty} 件${item.name}，单价 ${unit}，收入 ${earn} 元，${profit>=0?"赚":"亏"} ${Math.abs(profit)}。`, profit>=0?"good":"bad");
  render();
}

function heal(){
  if (S.health >= 100){ log("小强身体倍儿棒，不用补。", "dim"); return; }
  const gain = Math.min(10, 100 - S.health);
  const cost = S.married.includes("巧云") ? 0 : gain * 15;
  if (cost > S.cash){ log(`疗养要 ${cost} 元，现金不够。`, "bad"); return; }
  S.cash -= cost;
  S.health += gain;
  log(cost === 0
    ? `💊 巧云给小强熬了药、揉了筋骨：“俺家的人，不许带伤赶路。”健康 +${gain}（分文不取）。`
    : `💊 在街头诊所扎了几针、灌了两碗汤药，健康 +${gain}（花 ${cost} 元，不耗天数）。`, "good");
  render();
}

function enterRank(){ // 必玩榜：固定设施，花钱上榜，还折损健康（纯烧钱折腰的坑）
  if (S.ended) return;
  const fee = 1000;
  if (S.cash < fee){ log(`上榜要 ${fee} 元，小强摸了摸口袋，悻悻走开。`, "bad"); return; }
  S.cash -= fee;
  const loss = 10 + rnd(11); // 10~20 点
  S.health -= loss;
  grant("rank"); // 进过必玩榜且活着出来
  log(`🏨 小强豪掷 ${fee} 元冲进了"${S.city}必玩榜"，钱没了，腰也垮了（健康 -${loss}）。`, "bad");
  if (S.health <= 0){
    log("小强倒在必玩榜门口，日记本上写着：\"这条线，我还会再来的！\"", "bad");
    endGame("died");
    return;
  }
  render();
}

function buyTicket(n){
  if (S.ended) return;
  n = Math.floor(n || 0);
  if (n <= 0) return;
  const cost = n * 200;
  if (cost > S.cash){ log(`彩票 ${cost} 元，现金不够。`, "bad"); return; }
  S.cash -= cost;
  S.tickets += n;
  log(`🎰 买了 ${n} 张彩票（¥${cost}），现在共持有 ${S.tickets} 张。坐车离开本城后开奖。`);
  render();
}

function drawLottery(){ // 每次换城后开奖，逐张判定
  if (S.tickets <= 0) return;
  let prize = 0, jAckpot = 0, big = 0, mid = 0, small = 0;
  for (let i = 0; i < S.tickets; i++){
    const roll = rnd(1000); // 千分位
    if (roll < 2){ prize += 20000; jAckpot++; }        // 0.2% 头奖 20000
    else if (roll < 12){ prize += 5000; big++; }       // 1% 二等奖 5000
    else if (roll < 60){ prize += 1000; mid++; }       // 4.8% 三等奖 1000
    else if (roll < 180){ prize += 300; small++; }     // 12% 小奖 300
  }
  log(`🎰 开奖！${S.tickets} 张彩票：头奖×${jAckpot} 二等×${big} 三等×${mid} 小奖×${small}`, prize > 0 ? "good" : "dim");
  if (prize > 0){
    S.cash += prize;
    log(`💰 彩票共中奖 ${prize} 元！${jAckpot ? "小强手抖着数了好几遍——头奖！" : ""}`, "good");
  } else {
    log(`🕳️ 颗粒无收，废纸 ${S.tickets} 张。`);
  }
  S.tickets = 0;
}

function repay(amt){ // 还债：不耗天数，还多少少多少，日息按剩余欠款计算
  if (S.ended || S.debt <= 0) return;
  amt = Math.floor(amt || 0);
  if (amt <= 0){ log("还债金额得大于 0。", "bad"); return; }
  const maxPay = Math.min(S.cash, S.debt);
  if (amt > maxPay){
    if (maxPay <= 0){ log("现金不够还债。", "bad"); return; }
    amt = maxPay;
    log(`金额超出上限，自动改为还 ${amt} 元（受${S.cash < S.debt ? "现金" : "欠款余额"}限制）。`, "warn");
  }
  S.cash -= amt;
  S.debt -= amt;
  if (S.debt === 0) grant("repayAll");
  log(`🧾 还给村长 ${amt} 元${S.debt > 0 ? `，还欠 ${S.debt} 元` : "，欠款清零！腰杆终于直了！"}。`, S.debt > 0 ? "" : "good");
  render();
}

// ==================== 佳人交互 ====================
function womanOf(city){ return WOMEN[city] || null; }
function favorOf(name){ return S.favor[name] || 0; }
function addFavor(name, amt){
  const before = favorOf(name);
  S.favor[name] = Math.min(100, before + amt);
  const w = Object.values(WOMEN).find(w => w.name === name);
  log(`💗 ${name}好感度 +${S.favor[name]-before}（${S.favor[name]}/100）`);
  if (before < 100 && S.favor[name] >= 100) log(`💞 ${name}看你的眼神变了。或许……可以成婚了？`, "good");
}

function interactWoman(name, kind){
  const w = Object.values(WOMEN).find(w => w.name === name);
  if (!w) return;
  const lines = w.lines[kind] || [""];
  const line = pick(lines);
  if (kind === "chat"){
    if (S.chatToday[name]){ log(`${name}：“今天话都说完啦，明天再来。”`, "dim"); return; }
    S.chatToday[name] = true;
    log(`🗣️ ${line}`);
    addFavor(name, 2);
  } else if (kind === "dinner"){
    const cost = 500;
    if (S.cash < cost){ log(`请${name}吃饭要 ${cost} 元，现金不够。`, "bad"); return; }
    S.cash -= cost;
    log(`🍜 ${line}（¥${cost}）`);
    addFavor(name, 5 + rnd(4));
  } else if (kind === "gift"){
    const cost = 2000;
    if (S.cash < cost){ log(`像样的礼物得 ${cost} 元，现金不够。`, "bad"); return; }
    S.cash -= cost;
    log(`🎁 ${line}（¥${cost}）`);
    addFavor(name, 14 + rnd(5));
  } else if (kind === "brawl"){
    if (S.health <= 15){ log("小强伤得太重，打不动了。", "bad"); return; }
    S.health -= 10;
    log(`🩸 ${line}（健康 -10）`, "bad");
    addFavor(name, 16 + rnd(5));
    if (S.health <= 0){
      log("小强倒在了佳人面前……", "bad");
      endGame("died");
      return;
    }
  }
  render();
}

function marry(name){
  const w = Object.values(WOMEN).find(w => w.name === name);
  if (favorOf(name) < 100){ log(`${name}还没答应你。好感度要满 100。`, "bad"); return; }
  const fee = 5000;
  if (S.cash < fee){ log(`办婚礼得 ${fee} 元，先攒攒家底。`, "bad"); return; }
  S.cash -= fee;
  S.married.push(name);
  grant("marry1");
  if (S.married.length >= Object.keys(WOMEN).length) grant("marry4");
  log(`🏮 ${pick(w.lines.marry)}（婚礼 ¥${fee}）`, "good");
  log(`💐 ${name}成为小强的媳妇！被动加成：${WIFE_PERK[name]}`, "good");
  render();
}

function unlockNpc(){ // 付费解锁当地 NPC 黑市
  const npc = NPCS[S.city];
  if (!npc || S.npcUnlocked[S.city]) return;
  if (S.cash < npc.fee){ log(`${npc.name}撇撇嘴："${npc.fee} 块都拿不出来，谈什么生意？"`, "bad"); return; }
  S.cash -= npc.fee;
  S.npcUnlocked[S.city] = true;
  log(`🤝 付了 ${npc.fee} 元，${npc.name}终于松口："以后我的货，你随便拿。" ${S.city}黑市解锁！`, "good");
  render();
}

const LB_KEY = "daoye:localScores";
const localBoard = () => { try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch(e){ return []; } };
const saveLocalBoard = list => localStorage.setItem(LB_KEY, JSON.stringify(list.sort((a,b)=>b.wealth-a.wealth).slice(0,50)));
const validBoard = list => Array.isArray(list) ? list.filter(e => e && typeof e.wealth === "number") : [];

async function boardFetch(){ // 云榜优先，失败退回本机榜
  if (PANTRY_ID){
    try {
      const r = await fetch(BASKET_API(PANTRY_ID), { cache:"no-store" });
      if (r.ok) return validBoard(await r.json());
    } catch(e){}
  }
  return localBoard();
}

async function boardPush(rec){
  const lb = localBoard(); lb.push(rec); saveLocalBoard(lb); // 本机永远留一份
  if (!PANTRY_ID) return "本机排行榜（未配置云存储）";
  try {
    let list = [];
    const r0 = await fetch(BASKET_API(PANTRY_ID), { cache:"no-store" });
    if (r0.ok) list = validBoard(await r0.json());
    list.push(rec);
    const r1 = await fetch(BASKET_API(PANTRY_ID), {
      method:"PUT", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(list.slice(-200)),
    });
    if (r1.ok) return "全服排行榜";
    throw 0;
  } catch(e){ return "本机排行榜（云端暂不可达）"; }
}

function uploadScore(reason, wealth){
  const name = prompt("混完了！留下大名上排行榜（留空则匿名）：", "") || "无名小强";
  const rec = { name, wealth, day:S.day, city:S.city, died:reason==="died", at:new Date().toISOString() };
  boardPush(rec).then(where => log(`🏆 成绩已记入${where}。`, "dim"));
}

async function createPantry(){ // 在浏览器控制台运行一次，输出 pantry ID 填进 PANTRY_ID
  try {
    const r = await fetch("https://api.getpantry.cloud/pantry", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ name: "倒爷排行榜" }),
    });
    const j = await r.json();
    if (j.id){ console.log("pantry ID = " + JSON.stringify(j.id)); return j.id; }
    console.log("创建失败：" + JSON.stringify(j));
    return "";
  } catch(e){ console.log("创建失败（网络不通），排行榜将使用本机榜"); return ""; }
}

async function showBoard(){
  const list = (await boardFetch()).sort((a,b)=>b.wealth-a.wealth).slice(0,10);
  let text = "🏆 倒爷排行榜 TOP10 🏆\n" + (PANTRY_ID ? "" : "（本机榜：未配置云存储）\n");
  if (!list.length) text += "（还没人上榜，你就是第一个传奇）";
  list.forEach((e,i) => {
    text += `${String(i+1).padStart(2)}. ${String(e.name).slice(0,12)}  ${e.wealth} 元  第${e.day}天·${e.city}${e.died?"（客死）":""}\n`;
  });
  alert(text);
}

function endGame(reason){
  S.ended = true;
  const wealth = S.cash - S.debt;
  if (wealth >= 100000) grant("rich");
  let title;
  if (reason === "died") title = S.married.length
    ? `小强客死他乡……${S.married.join("、")}在村口等了一辈子。`
    : "小强客死他乡……（健康耗尽）";
  else if (S.married.length === Object.keys(WOMEN).length) title = "四位佳人在村口支了四张桌子，小强的家宴成了传说。";
  else if (S.married.length && wealth >= 100000) title = `小强带着${S.married[0]}衣锦还乡，村里人都说这段姻缘是修来的。`;
  else if (S.married.length && wealth >= 30000) title = `小强和${S.married[0]}回了村，日子不算大富，倒也和美。`;
  else if (wealth >= 100000) title = "衣锦还乡！小强成了村里的传奇！";
  else if (wealth >= 30000) title = "体面回乡，村里人都说小强有出息。";
  else if (wealth >= 5500) title = "还清欠款，小强攒下了一点积蓄。";
  else if (wealth >= 0) title = "勉强还清欠款，兜里空空。小强叹了口气。";
  else title = "小强没能还清欠款，被村长追着跑……";
  log(`=== 结局 ===`, "dim");
  log(`${title}`, "end");
  log(`最终资产 = 现金 ${S.cash} - 债务 ${S.debt} = ${wealth} 元`, "end");
  if (S.married.length) log(`💍 娶了：${S.married.join("、")}`, "good");
  if (S.achv.length){
    log(`🏅 本局成就：${S.achv.map(k => ACHVS[k][0]).join("、")}`, "warn");
  }
  log(`存活 ${S.day} 天。`, "dim");
  uploadScore(reason, wealth);
  render();
}

// ==================== 渲染 ====================
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const used = bagUsed();
  const wealth = S.cash - S.debt;
  document.getElementById("status").innerHTML =
`<span class="dim">日期</span> 第 ${S.day}/${TOTAL_DAYS} 天   <span class="dim">所在</span> ${esc(S.city)}
<span class="dim">现金</span> ${S.cash} 元   <span class="dim">债务</span> <span class="bad">${S.debt}</span> 元   <span class="dim">净资产</span> <span class="${wealth>=0?"good":"bad"}">${wealth}</span> 元
<span class="dim">健康</span> ${S.health}/100   <span class="dim">背包</span> ${used}/${S.capacity} 格`;

  if (S.ended){
    document.getElementById("market").innerHTML = "";
    document.getElementById("actions").innerHTML =
      `<button onclick="location.reload()">再来一局</button><button onclick="showBoard()">🏆 排行榜</button><button onclick="location.href='./'">返回大厅</button>`;
    return;
  }

  let h = `<h2>本地市场 —— ${esc(S.city)}黑市</h2><div class="tblwrap"><table><tr><th>商品</th><th>行情</th><th>持有</th><th>买入</th><th>卖出</th></tr>`;
  const free = S.capacity - bagUsed();
  const rowOf = (id, displayName, priceText, unit, stockLimit) => {
    const e = S.bag[id];
    let maxBuy = unit === Infinity ? 0 : Math.max(0, Math.min(free, Math.floor(S.cash / unit)));
    if (stockLimit !== undefined) maxBuy = Math.min(maxBuy, stockLimit);
    const qid = typeof id === "string" ? `'${id}'` : id;
    return `<tr><td>${displayName}</td><td>${priceText}</td>
      <td>${e ? e.qty+"件(均价"+e.avg+")" : '<span class="dim">-</span>'}</td>
      <td><input type="number" id="b${id}" min="1" max="${maxBuy}" ${maxBuy>0?`value="${Math.min(10,maxBuy)}"`:'value="0" disabled'}><button onclick="buy(${qid},+document.getElementById('b${id}').value)" ${maxBuy<=0?"disabled":""}>买</button><span class="dim"> ≤${maxBuy}</span></td>
      <td>${e ? `<input type="number" id="s${id}" min="1" max="${e.qty}" value="${e.qty}"><button onclick="sell(${qid},+document.getElementById('s${id}').value)">卖</button>` : '<span class="dim">-</span>'}</td></tr>`;
  };
  for (const q of S.market){
    const it = ITEMS.find(i => i.id === q.id);
    const bu = Math.ceil(q.price * 1.08);
    h += rowOf(q.id, `<span title="${esc(it.desc)}">${it.name}</span>`, `收 ${bu} / 出 ${Math.floor(q.price*0.9)}`, bu);
  }
  // 特殊货：任何城市都能按当日行情出手
  for (const c in NPCS) for (const g of NPCS[c].goods){
    const sellP = S.specialPrices[g.id];
    const stock = S.npcStock[g.id] || 0;
    const canBuy = c === S.city && S.npcUnlocked[c] && stock > 0;
    h += rowOf(g.id, `⭐${g.name}<span class="dim">(${c})</span>`,
      canBuy ? `收 ${g.buy} / 出 ${sellP} <span class="dim">货剩${stock}</span>` : `<span class="dim">出 ${sellP}${c===S.city?"（无货）":""}</span>`,
      canBuy ? (S.married.includes("如玉") ? Math.round(g.buy*0.8) : g.buy) : Infinity,
      canBuy ? stock : undefined);
  }
  h += `</table></div>`;
  h += `<span class="dim">⭐特殊货：找对应城市的NPC付费开黑市才能进货；行情每天浮动，可在任意城市出手。"收"是黑市要价(+15%)，"出"是出手价(95折)</span>`;
  document.getElementById("market").innerHTML = h;

  let a = `<h2>赶路（每天只能去一个城市）</h2>`;
  for (const c of CITIES){
    if (c !== S.city) a += `<button onclick="travel('${c}')">去${c}</button>`;
  }
  if (S.health < 100){
    const gain = Math.min(10, 100 - S.health);
    a += `<br><button onclick="heal()">💊 疗养 +${gain}健康（¥${gain*15}，不耗天数）</button>`;
  }
  if (S.debt > 0){
    const maxPay = Math.min(S.cash, S.debt);
    a += `<br><input type="number" id="repayAmt" min="1" max="${maxPay}" ${maxPay>0?`value="${maxPay}"`:'value="0" disabled'}><button onclick="repay(+document.getElementById('repayAmt').value)" ${maxPay<=0?"disabled":""}>🧾 还债（≤${maxPay}，不耗天数）</button>`;
  }
  a += ` <button onclick="enterRank()">🏨 冲${esc(S.city)}必玩榜（¥1000，伤身，不耗天数）</button>`;
  const npc = NPCS[S.city];
  if (npc && !S.npcUnlocked[S.city]){
    a += ` <button onclick="unlockNpc()">🤝 找${npc.name}开黑市（¥${npc.fee}，不耗天数）</button>`;
  } else if (npc){
    a += ` <span class="dim">🤝 ${npc.name}的黑市已向你开放</span>`;
  }
  const w = womanOf(S.city);
  if (w && !S.married.includes(w.name)){
    const fv = favorOf(w.name);
    a += `<br><span class="good">💗 ${w.title}·${w.name}</span> <span class="dim">好感 ${fv}/100${S.married.length?"（已婚另娶？你随意）":""}</span><br>`;
    a += `<button onclick="interactWoman('${w.name}','chat')">🗣️ 聊天(+2，每天一次)</button>`;
    a += `<button onclick="interactWoman('${w.name}','dinner')">🍜 请吃饭 ¥500(+5~8)</button>`;
    a += `<button onclick="interactWoman('${w.name}','gift')">🎁 送礼 ¥2000(+14~18)</button>`;
    a += `<button onclick="interactWoman('${w.name}','brawl')">🩸 为她出头(-10健康，+16~20)</button>`;
    if (fv >= 100) a += `<button onclick="marry('${w.name}')">🏮 迎娶${w.name}（婚礼 ¥5000）</button>`;
  } else if (w){
    a += ` <span class="good">💍 ${w.name}是你的媳妇（${WIFE_PERK[w.name]}）</span>`;
  }
  a += `<span class="dim"> 移动消耗一天，并刷新当地行情</span><br><input type="number" id="tktn" min="1" max="99" value="1"><button onclick="buyTicket(+document.getElementById('tktn').value)">🎰 买彩票 ¥200/张（换城后开奖，持有 ${S.tickets} 张）</button><button onclick="showBoard()">🏆 排行榜</button><button onclick="if(confirm('回大厅将丢失当前进度，确定？'))location.href='./'">🏠 返回大厅</button>`;
  document.getElementById("actions").innerHTML = a;
}
