<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小强倒爷记</title>
<style>
  :root { --bg:#0d0f0c; --fg:#b8c9a8; --dim:#5c6b52; --good:#8fd67a; --bad:#e07a5f; --warn:#e6c86e; --accent:#88b04b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"Cascadia Mono",Consolas,"Microsoft YaHei",monospace; font-size:15px; line-height:1.6; }
  #wrap { max-width:860px; margin:0 auto; padding:16px 20px 80px; }
  h1 { color:var(--accent); letter-spacing:2px; font-size:20px; border-bottom:1px dashed var(--dim); padding-bottom:8px; }
  #status { border:1px solid var(--dim); padding:8px 12px; margin-bottom:12px; white-space:pre-wrap; }
  #log { border:1px solid var(--dim); padding:8px 12px; height:340px; overflow-y:auto; white-space:pre-wrap; margin-bottom:12px; }
  .good { color:var(--good); } .bad { color:var(--bad); } .warn { color:var(--warn); } .dim { color:var(--dim); }
  h2 { color:var(--accent); font-size:15px; margin:14px 0 6px; }
  table { border-collapse:collapse; width:100%; margin-bottom:10px; }
  td, th { border:1px solid var(--dim); padding:3px 8px; font-size:13px; }
  th { color:var(--accent); text-align:left; }
  button { background:transparent; color:var(--fg); border:1px solid var(--accent); font:inherit; font-size:13px; padding:2px 10px; margin:2px 2px 2px 0; cursor:pointer; }
  button:hover { background:var(--accent); color:var(--bg); }
  button:disabled { color:var(--dim); border-color:var(--dim); cursor:not-allowed; }
  button:disabled:hover { background:transparent; color:var(--dim); }
  input[type=number] { width:70px; background:var(--bg); color:var(--fg); border:1px solid var(--dim); font:inherit; font-size:13px; padding:1px 4px; }
  #actions { border:1px solid var(--dim); padding:10px 12px; }
  .end { font-size:18px; color:var(--warn); }
  .tblwrap { overflow-x:auto; }
  /* 手机适配 */
  @media (max-width: 640px){
    body { font-size:14px; }
    #wrap { padding:10px 10px 60px; }
    h1 { font-size:16px; letter-spacing:1px; }
    #log { height:240px; padding:6px 8px; font-size:13px; }
    #status { font-size:13px; white-space:normal; }
    td, th { padding:4px 5px; font-size:12px; white-space:nowrap; }
    input[type=number] { width:58px; }
    button { padding:6px 12px; min-height:32px; } /* 触控友好 */
    #actions button { margin:4px 4px 4px 0; }
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>小强倒爷记 —— 五城倒货 40 天</h1>
  <div id="status"></div>
  <div id="log"></div>
  <div id="market"></div>
  <div id="actions"></div>
</div>
<script>
"use strict";
// ==================== 数据 ====================
const TOTAL_DAYS = 40;
const ITEMS = [
  { id:1, name:"廊坊驴肉火烧",        base:8,    range:12,   desc:"便宜顶饱，走量起步" },
  { id:2, name:"德州扒鸡(真空装)",    base:45,   range:60,   desc:"铁路沿线硬通货" },
  { id:3, name:"济南把子肉",          base:30,   range:45,   desc:"便宜大碗，偶尔被吃货抢购" },
  { id:4, name:"青岛啤酒(塑料袋装)",  base:60,   range:120,  desc:"波动大，旺季暴涨" },
  { id:5, name:"崂山白花蛇草水",      base:120,  range:280,  desc:"传说中的神水，味道劝退" },
  { id:6, name:"章丘铁锅",            base:500,  range:600,  desc:"手工锻造，风吹起来就是天价" },
  { id:7, name:"斐济杯",              base:3000, range:4000, desc:"昂贵，行情极端" },
  { id:8, name:"黄油碟片",            base:800,  range:1500, desc:"灰色生意，波动剧烈" },
];
const CITIES = ["青岛","廊坊","德州","济南","南京"];

// ==================== 排行榜配置（jsonblob 全服共享榜）====================
// 使用方法（一次性）：
//   1. 用浏览器打开游戏页面，按 F12 打开控制台，粘贴运行 createBlob() （游戏里已内置该函数）
//   2. 控制台会输出一串 blob ID，填到下面引号里并保存重新部署
//   3. 如果打不开 jsonblob（网络问题），排行榜自动降级为"本机榜"，不影响游戏
const LEADER_BLOB_ID = "";
const LEADER_API = id => `https://jsonblob.com/api/jsonBlob/${id}`;
// 特殊 NPC 黑市：付费解锁，只卖不买（货可以带到任何城市卖）
const NPCS = {
  "青岛": { name:"陈润刚", fee:2000, goods:[
    { id:"q1", name:"群勃龙",         buy:1200, sellBase:2400 },
    { id:"q2", name:"康力龙",         buy:800,  sellBase:1700 },
  ]},
  "德州": { name:"王胜举", fee:2500, goods:[
    { id:"d1", name:"黄金炒茄子",     buy:1800, sellBase:4200 },
    { id:"d2", name:"无线收音机",     buy:2600, sellBase:5400 },
  ]},
  "济南": { name:"张震", fee:3000, goods:[
    { id:"j1", name:"绝版迈腾子",     buy:3000, sellBase:6200 },
    { id:"j2", name:"稀有的牙",       buy:2200, sellBase:4600 },
  ]},
  "南京": { name:"禹发", fee:4000, goods:[
    { id:"n1", name:"夫子庙夜明珠",   buy:5000, sellBase:10500 },
    { id:"n2", name:"明孝陵金砖",     buy:4000, sellBase:9000 },
  ]},
};
const PRICE_EVENTS = [
  { text:"德州站前广场排起长队，扒鸡被抢购一空！",        item:2, mul:3 },
  { text:"美食博主探店把子肉，济南把子肉全网爆火！",      item:3, mul:4 },
  { text:"啤酒节开幕！青岛啤酒供不应求，价格狂飙！",      item:4, mul:4 },
  { text:"《舌尖》剧组拍了铁锅，章丘铁锅一夜封神！",      item:6, mul:5 },
  { text:"漫展人山人海，斐济杯一夜脱销，价格起飞！",      item:7, mul:3 },
  { text:"碟友圈疯传绝版资源，黄油碟片被炒上天价！",      item:8, mul:4 },
  { text:"养生专家直播吹爆蛇草水，割韭菜无数！",          item:5, mul:6 },
  { text:"物流恢复，外地火烧大量涌入，价格崩了。",        item:1, div:3 },
  { text:"工厂直营店杀进漫展，斐济杯价格跳水。",          item:7, div:4 },
  { text:"啤酒节结束，青岛啤酒大量滞销。",                item:4, div:5 },
  { text:"铁路高速化，沿线特产不再稀缺，扒鸡跌价。",      item:2, div:4 },
  { text:"章丘铁锅被曝机器量产，信仰崩塌，价格跳水。",    item:6, div:5 },
  { text:"扫黄打非专项行动，碟片市场风声鹤唳，价格崩了。", item:8, div:4 },
];
const CASH_EVENTS = [
  { text:"火车站口一个汉子拦住你：\"兄弟，给点钱用！\"",      pct:10 },
  { text:"一个大爷碰了你一下：\"别撞了！\"然后要医药费。",    pct:40 },
  { text:"三个戴红袖章的大妈揪住你：\"外地人？罚款！\"",      pct:20 },
  { text:"中介说：\"办暂住证，交点手续费。\"",                pct:15 },
  { text:"你在夜市吃串被多收了钱，还不敢吭声。",              pct:10 },
  { text:"城管来了，你的摊子被掀，货损惨重。",                pct:25 },
];

// ==================== 状态 ====================
let S = null;
const rnd = n => Math.floor(Math.random()*n);
const pick = arr => arr[rnd(arr.length)];

function priceOf(item){ return item.base + rnd(item.range + 1); }
function newMarket(){ return ITEMS.map(it => ({ id:it.id, price:priceOf(it) })); }
function newSpecialPrices(){ // 特殊货在各城的出手价每天浮动：0.6~1.7 倍基准
  const p = {};
  for (const c in NPCS) for (const g of NPCS[c].goods)
    p[g.id] = Math.round(g.sellBase * (0.6 + rnd(110)/100));
  return p;
}

function initState(){
  return {
    day: 1, city: "青岛", cash: 2000, debt: 5500, health: 100,
    bag: {}, // itemId -> {qty, avg}（普通商品 id 为数字，特殊货为字符串）
    capacity: 100,
    market: newMarket(),
    specialPrices: newSpecialPrices(),
    npcUnlocked: {}, // 已付费解锁的黑市：城市名 -> true
    ended: false, journal: [],
  };
}

// ==================== 日志 ====================
function log(text, cls){
  const el = document.getElementById("log");
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.textContent = `【第${S.day}天·${S.city}】${text}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

// ==================== 核心逻辑 ====================
function bagUsed(){ return Object.values(S.bag).reduce((s,e)=>s+e.qty,0); }

function travel(dest){
  if (S.ended || dest === S.city) return;
  S.day += 1;
  S.city = dest;
  S.market = newMarket();
  log(`小强坐上了去${dest}的车……`, "dim");

  // 债务利息（难度上调：日息 15%）
  if (S.debt > 0){
    const interest = Math.floor(S.debt * 15 / 100);
    S.debt += interest;
    if (interest > 0) log(`村长托人带话：欠款利息 +${interest}，现在欠 ${S.debt} 元。`, "warn");
  }
  // 特殊货行情刷新
  S.specialPrices = newSpecialPrices();

  // 火车站安检：黑市货（⭐特殊货）有 15% 几率被整批查获
  for (const id of Object.keys(S.bag)){
    if (typeof id !== "string") continue;
    if (rnd(100) < 15){
      const g = findSpecial(id);
      const e = S.bag[id];
      const loss = (S.specialPrices[id] || g.sellBase) * e.qty;
      delete S.bag[id];
      log(`🚔 火车站安检口被拦下！${e.qty} 件${g.name}被查获没收（价值约 ${loss} 元），小强眼睁睁看着货被搬走……`, "bad");
    }
  }

  // 商业事件（60% 概率）
  if (rnd(10) < 6){
    const ev = pick(PRICE_EVENTS);
    const q = S.market.find(m => m.id === ev.item);
    const item = ITEMS.find(i => i.id === ev.item);
    if (ev.mul) q.price = Math.round(q.price * ev.mul);
    else q.price = Math.max(1, Math.round(q.price / ev.div));
    log(`📰 ${ev.text}（${item.name} 现价 ${q.price}）`, "warn");
  }

  // 现金事件（35% 概率）
  if (rnd(20) < 7 && S.cash > 0){
    const ev = pick(CASH_EVENTS);
    const loss = Math.floor(S.cash * ev.pct / 100);
    S.cash -= loss;
    log(`💸 ${ev.text}（现金 -${loss}）`, "bad");
  }

  // 欠款太多被揍
  if (S.debt > 100000){
    S.health -= 30;
    log(`👊 小强欠钱太多，村长叫老乡们把小强揍了一顿！（健康 -30）`, "bad");
  }

  // 终局判定
  if (S.health <= 0){
    log("小强倒在了路边，日记本上写着：\"这条线，我还会再来的！\"", "bad");
    endGame("died");
    return;
  }
  if (S.day >= TOTAL_DAYS){
    endGame("timeup");
    return;
  }
  if (S.day === TOTAL_DAYS - 1) log("⏰ 明天就是最后一天了，快清仓回乡！", "warn");
  render();
}

// ======== 价格辅助：难度来自买卖差价（黑市收货 +15%，出手 -10%）========
function findSpecial(id){
  for (const c in NPCS){ const g = NPCS[c].goods.find(g => g.id === id); if (g) return g; }
  return null;
}
function buyUnitPrice(id){
  if (typeof id === "string") return findSpecial(id).buy;       // 特殊货：NPC 固定价
  const q = S.market.find(m => m.id === id);
  return Math.ceil(q.price * 1.15);                              // 普通货：加价 15% 收
}
function sellUnitPrice(id){
  if (typeof id === "string") return S.specialPrices[id] || 0;   // 特殊货：每日浮动行情
  const q = S.market.find(m => m.id === id);
  return Math.floor(q.price * 0.9);                              // 普通货：出手打 9 折
}

function buy(id, qty){
  if (qty <= 0) return;
  let unit, name;
  if (typeof id === "string"){ // 特殊货：只能在货主城市、且已解锁黑市时购买
    const npc = NPCS[S.city];
    const g = npc && npc.goods.find(g => g.id === id);
    if (!g){ log("这里没人卖这个货。", "bad"); return; }
    if (!S.npcUnlocked[S.city]){ log(`先找到${npc.name}付钱开黑市。`, "bad"); return; }
    unit = g.buy; name = g.name;
  } else {
    unit = buyUnitPrice(id);
    name = ITEMS.find(i => i.id === id).name;
  }
  const free = S.capacity - bagUsed();
  const maxAffordable = Math.floor(S.cash / unit);
  const maxQty = Math.min(free, maxAffordable);
  if (qty > maxQty){
    if (maxQty <= 0){ log(free === 0 ? "背包满了。" : "现金不够。", "bad"); return; }
    qty = maxQty;
    log(`数量超出上限，自动改为买 ${qty} 件（受${free < maxAffordable ? "背包格数" : "现金"}限制）。`, "warn");
  }
  const cost = unit * qty;
  const e = S.bag[id] || { qty:0, avg:0 };
  e.avg = Math.round((e.avg*e.qty + unit*qty) / (e.qty+qty));
  e.qty += qty;
  S.bag[id] = e;
  S.cash -= cost;
  log(`买了 ${qty} 件${name}，单价 ${unit}，花 ${cost} 元（均价 ${e.avg}）。`);
  render();
}

function sell(id, qty){
  const e = S.bag[id];
  if (!e || qty <= 0) return;
  if (qty > e.qty) qty = e.qty;
  const unit = sellUnitPrice(id);
  const item = findSpecial(id) || ITEMS.find(i => i.id === id);
  const earn = unit * qty;
  const profit = (unit - e.avg) * qty;
  e.qty -= qty;
  if (e.qty === 0) delete S.bag[id];
  S.cash += earn;
  log(`卖出 ${qty} 件${item.name}，单价 ${unit}，收入 ${earn} 元，${profit>=0?"赚":"亏"} ${Math.abs(profit)}。`, profit>=0?"good":"bad");
  render();
}

function heal(){
  if (S.health >= 100){ log("小强身体倍儿棒，不用补。", "dim"); return; }
  const gain = Math.min(10, 100 - S.health);
  const cost = gain * 15;
  if (cost > S.cash){ log(`疗养要 ${cost} 元，现金不够。`, "bad"); return; }
  S.cash -= cost;
  S.health += gain;
  log(`💊 在街头诊所扎了几针、灌了两碗汤药，健康 +${gain}（花 ${cost} 元，不耗天数）。`, "good");
  render();
}

function enterRank(){ // 必玩榜：固定设施，花钱上榜，还折损健康（纯烧钱折腰的坑）
  if (S.ended) return;
  const fee = 1000;
  if (S.cash < fee){ log(`上榜要 ${fee} 元，小强摸了摸口袋，悻悻走开。`, "bad"); return; }
  S.cash -= fee;
  const loss = 10 + rnd(11); // 10~20 点
  S.health -= loss;
  log(`🏨 小强豪掷 ${fee} 元冲进了"${S.city}必玩榜"，钱没了，腰也垮了（健康 -${loss}）。`, "bad");
  if (S.health <= 0){
    log("小强倒在必玩榜门口，日记本上写着：\"这条线，我还会再来的！\"", "bad");
    endGame("died");
    return;
  }
  render();
}

function repay(amt){ // 还债：不耗天数，还多少少多少，日息按剩余欠款计算
  if (S.ended || S.debt <= 0) return;
  amt = Math.floor(amt || 0);
  if (amt <= 0){ log("还债金额得大于 0。", "bad"); return; }
  const maxPay = Math.min(S.cash, S.debt);
  if (amt > maxPay){
    if (maxPay <= 0){ log("现金不够还债。", "bad"); return; }
    amt = maxPay;
    log(`金额超出上限，自动改为还 ${amt} 元（受${S.cash < S.debt ? "现金" : "欠款余额"}限制）。`, "warn");
  }
  S.cash -= amt;
  S.debt -= amt;
  log(`🧾 还给村长 ${amt} 元${S.debt > 0 ? `，还欠 ${S.debt} 元` : "，欠款清零！腰杆终于直了！"}。`, S.debt > 0 ? "" : "good");
  render();
}

function unlockNpc(){ // 付费解锁当地 NPC 黑市
  const npc = NPCS[S.city];
  if (!npc || S.npcUnlocked[S.city]) return;
  if (S.cash < npc.fee){ log(`${npc.name}撇撇嘴："${npc.fee} 块都拿不出来，谈什么生意？"`, "bad"); return; }
  S.cash -= npc.fee;
  S.npcUnlocked[S.city] = true;
  log(`🤝 付了 ${npc.fee} 元，${npc.name}终于松口："以后我的货，你随便拿。" ${S.city}黑市解锁！`, "good");
  render();
}

// ==================== 排行榜 ====================
const LB_KEY = "daoye:localScores";
const localBoard = () => { try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; } catch(e){ return []; } };
const saveLocalBoard = list => localStorage.setItem(LB_KEY, JSON.stringify(list.sort((a,b)=>b.wealth-a.wealth).slice(0,50)));
const validBoard = list => Array.isArray(list) ? list.filter(e => e && typeof e.wealth === "number") : [];

async function boardFetch(){ // 云榜优先，失败退回本机榜
  if (LEADER_BLOB_ID){
    try {
      const r = await fetch(LEADER_API(LEADER_BLOB_ID), { cache:"no-store" });
      if (r.ok) return validBoard(await r.json());
    } catch(e){}
  }
  return localBoard();
}

async function boardPush(rec){
  const lb = localBoard(); lb.push(rec); saveLocalBoard(lb); // 本机永远留一份
  if (!LEADER_BLOB_ID) return "本机榜（未配置云存储）";
  try {
    const r0 = await fetch(LEADER_API(LEADER_BLOB_ID), { cache:"no-store" });
    if (!r0.ok) throw 0;
    const list = validBoard(await r0.json());
    list.push(rec);
    const r1 = await fetch(LEADER_API(LEADER_BLOB_ID), {
      method:"PUT", headers:{ "Content-Type":"application/json", "Accept":"application/json" },
      body: JSON.stringify(list.slice(-200)),
    });
    if (r1.ok) return "全服排行榜";
    throw 0;
  } catch(e){ return "本机榜（云端暂不可达）"; }
}

function uploadScore(reason, wealth){
  const name = prompt("混完了！留下大名上排行榜（留空则匿名）：", "") || "无名小强";
  const rec = { name, wealth, day:S.day, city:S.city, died:reason==="died", at:new Date().toISOString() };
  boardPush(rec).then(where => log(`🏆 成绩已记入${where}。`, "dim"));
}

async function createBlob(){ // 在浏览器控制台运行一次，输出 blob ID 填进 LEADER_BLOB_ID
  try {
    const r = await fetch("https://jsonblob.com/api/jsonBlob", { method:"POST", headers:{"Content-Type":"application/json"}, body:"[]" });
    const loc = r.headers.get("Location") || "";
    const id = (loc.match(/[^/]+\/?$/) || [""])[0];
    console.log("blob ID = " + JSON.stringify(id));
    return id;
  } catch(e){ console.log("创建失败（网络不通），排行榜将使用本机榜"); return ""; }
}

async function showBoard(){
  const list = (await boardFetch()).sort((a,b)=>b.wealth-a.wealth).slice(0,10);
  let text = "🏆 倒爷排行榜 TOP10 🏆\n" + (LEADER_BLOB_ID ? "" : "（本机榜：未配置云存储）\n");
  if (!list.length) text += "（还没人上榜，你就是第一个传奇）";
  list.forEach((e,i) => {
    text += `${String(i+1).padStart(2)}. ${String(e.name).slice(0,12)}  ${e.wealth} 元  第${e.day}天·${e.city}${e.died?"（客死）":""}\n`;
  });
  alert(text);
}

function endGame(reason){
  S.ended = true;
  const wealth = S.cash - S.debt;
  let title;
  if (reason === "died") title = "小强客死他乡……（健康耗尽）";
  else if (wealth >= 100000) title = "衣锦还乡！小强成了村里的传奇！";
  else if (wealth >= 30000) title = "体面回乡，村里人都说小强有出息。";
  else if (wealth >= 5500) title = "还清欠款，小强攒下了一点积蓄。";
  else if (wealth >= 0) title = "勉强还清欠款，兜里空空。小强叹了口气。";
  else title = "小强没能还清欠款，被村长追着跑……";
  log(`=== 结局 ===`, "dim");
  log(`${title}`, "end");
  log(`最终资产 = 现金 ${S.cash} - 债务 ${S.debt} = ${wealth} 元`, "end");
  log(`存活 ${S.day} 天。`, "dim");
  uploadScore(reason, wealth);
  render();
}

// ==================== 渲染 ====================
function esc(s){ return s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const used = bagUsed();
  const wealth = S.cash - S.debt;
  document.getElementById("status").innerHTML =
`<span class="dim">日期</span> 第 ${S.day}/${TOTAL_DAYS} 天   <span class="dim">所在</span> ${esc(S.city)}
<span class="dim">现金</span> ${S.cash} 元   <span class="dim">债务</span> <span class="bad">${S.debt}</span> 元   <span class="dim">净资产</span> <span class="${wealth>=0?"good":"bad"}">${wealth}</span> 元
<span class="dim">健康</span> ${S.health}/100   <span class="dim">背包</span> ${used}/${S.capacity} 格`;

  if (S.ended){
    document.getElementById("market").innerHTML = "";
    document.getElementById("actions").innerHTML =
      `<button onclick="location.reload()">再来一局</button><button onclick="showBoard()">🏆 排行榜</button><button onclick="location.href='./'">返回大厅</button>`;
    return;
  }

  let h = `<h2>本地市场 —— ${esc(S.city)}黑市</h2><div class="tblwrap"><table><tr><th>商品</th><th>行情</th><th>持有</th><th>买入</th><th>卖出</th></tr>`;
  const free = S.capacity - bagUsed();
  const rowOf = (id, displayName, priceText, unit) => {
    const e = S.bag[id];
    const maxBuy = unit === Infinity ? 0 : Math.max(0, Math.min(free, Math.floor(S.cash / unit)));
    const qid = typeof id === "string" ? JSON.stringify(id) : id;
    return `<tr><td>${displayName}</td><td>${priceText}</td>
      <td>${e ? e.qty+"件(均价"+e.avg+")" : '<span class="dim">-</span>'}</td>
      <td><input type="number" id="b${id}" min="1" max="${maxBuy}" ${maxBuy>0?`value="${Math.min(10,maxBuy)}"`:'value="0" disabled'}><button onclick="buy(${qid},+document.getElementById('b${id}').value)" ${maxBuy<=0?"disabled":""}>买</button><span class="dim"> ≤${maxBuy}</span></td>
      <td>${e ? `<input type="number" id="s${id}" min="1" max="${e.qty}" value="${e.qty}"><button onclick="sell(${qid},+document.getElementById('s${id}').value)">卖</button>` : '<span class="dim">-</span>'}</td></tr>`;
  };
  for (const q of S.market){
    const it = ITEMS.find(i => i.id === q.id);
    const bu = Math.ceil(q.price * 1.15);
    h += rowOf(q.id, `<span title="${esc(it.desc)}">${it.name}</span>`, `收 ${bu} / 出 ${Math.floor(q.price*0.9)}`, bu);
  }
  // 特殊货：任何城市都能按当日行情出手
  for (const c in NPCS) for (const g of NPCS[c].goods){
    const sellP = S.specialPrices[g.id];
    const canBuy = c === S.city && S.npcUnlocked[c];
    h += rowOf(g.id, `⭐${g.name}<span class="dim">(${c})</span>`,
      canBuy ? `收 ${g.buy} / 出 ${sellP}` : `<span class="dim">出 ${sellP}</span>`,
      canBuy ? g.buy : Infinity);
  }
  h += `</table></div>`;
  h += `<span class="dim">⭐特殊货：找对应城市的NPC付费开黑市才能进货；行情每天浮动，可在任意城市出手。"收"是黑市要价(+15%)，"出"是出手价(9折)</span>`;
  document.getElementById("market").innerHTML = h;

  let a = `<h2>赶路（每天只能去一个城市）</h2>`;
  for (const c of CITIES){
    if (c !== S.city) a += `<button onclick="travel('${c}')">去${c}</button>`;
  }
  if (S.health < 100){
    const gain = Math.min(10, 100 - S.health);
    a += `<br><button onclick="heal()">💊 疗养 +${gain}健康（¥${gain*15}，不耗天数）</button>`;
  }
  if (S.debt > 0){
    const maxPay = Math.min(S.cash, S.debt);
    a += `<br><input type="number" id="repayAmt" min="1" max="${maxPay}" ${maxPay>0?`value="${maxPay}"`:'value="0" disabled'}><button onclick="repay(+document.getElementById('repayAmt').value)" ${maxPay<=0?"disabled":""}>🧾 还债（≤${maxPay}，不耗天数）</button>`;
  }
  a += ` <button onclick="enterRank()">🏨 冲${esc(S.city)}必玩榜（¥1000，伤身，不耗天数）</button>`;
  const npc = NPCS[S.city];
  if (npc && !S.npcUnlocked[S.city]){
    a += ` <button onclick="unlockNpc()">🤝 找${npc.name}开黑市（¥${npc.fee}，不耗天数）</button>`;
  } else if (npc){
    a += ` <span class="dim">🤝 ${npc.name}的黑市已向你开放</span>`;
  }
  a += `<span class="dim"> 移动消耗一天，并刷新当地行情</span><br><button onclick="showBoard()">🏆 排行榜</button><button onclick="if(confirm('回大厅将丢失当前进度，确定？'))location.href='./'">🏠 返回大厅</button>`;
  document.getElementById("actions").innerHTML = a;
}

// ==================== 开局 ====================
S = initState();
log("2000 年，小强揣着 2000 块在青岛站下了火车，口袋里还装着欠村长的 5500 块欠条。", "warn");
log("从青岛出发，沿线五城倒货 40 天，赚钱、保命、还债——这是小强的浮生记。");
log("提示：黑市收货要加价、出手要打折，想赚大钱得找各城的神秘 NPC 开黑市。", "dim");
render();
</script>
</body>
</html>
